<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
  font: 400 var(--fs-body)/1.45 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -.015em; }
h3 { font-size: 15px; font-weight: 600; }
a { color: var(--primary-ink); text-decoration: none; }
a.card, a.li, a.mod-card, a.nav-item, a.nav-link { color: inherit; }
a.card { display: block; }
a.mod-card { display: flex; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img, svg { display: block; }
.ic { display: inline-block; vertical-align: -0.22em; width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; } .ic.xs { width: 15px; height: 15px; } .ic.lg { width: 26px; height: 26px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.pos { color: var(--success); } .neg { color: var(--danger); } .accent { color: var(--primary-ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--primary-tint); }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

/* ===== Shell ===== */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
.sidebar { display: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--s-3);
  min-height: calc(var(--topbar-h) + var(--safe-t)); padding: var(--safe-t) var(--s-4) 0; background: var(--bg);
  border-bottom: 1px solid transparent; transition: border-color var(--t) var(--ease);
}
.topbar.scrolled { border-bottom-color: var(--border-soft); }
.topbar .grow { flex: 1; min-width: 0; }
.view { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: var(--s-2) var(--s-4) calc(var(--nav-h) + var(--safe-b) + 32px); outline: none; }
.view > .page { animation: page-in var(--t-slow) var(--ease); }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  height: calc(var(--nav-h) + var(--safe-b)); padding: 0 var(--s-2) var(--safe-b); background: var(--surface-1); border-top: 1px solid var(--border-soft);
}
.bottomnav .nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: var(--nav-h);
  color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .01em; transition: color var(--t-fast);
}
.bottomnav .nav-item.active { color: var(--primary-ink); }
.bottomnav .nav-item:active { transform: scale(.96); }
.bottomnav .fab-slot { display: flex; justify-content: center; align-items: center; height: var(--nav-h); }
.fab {
  width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--on-primary);
  transform: translateY(-14px); box-shadow: 0 0 0 6px var(--bg), 0 10px 24px -8px rgba(242, 183, 5, .55); transition: transform var(--t-fast) var(--ease);
}
.fab .ic { width: 26px; height: 26px; stroke-width: 2.2; }
.fab:active { transform: translateY(-14px) scale(.94); }

/* ===== Tablet ===== */
@media (min-width: 640px) {
  .view { padding-left: var(--s-6); padding-right: var(--s-6); }
  .bottomnav { left: 50%; right: auto; width: min(560px, calc(100% - 32px)); transform: translateX(-50%); bottom: 12px; border-radius: 24px; border: 1px solid var(--border); padding-bottom: 0; height: var(--nav-h); box-shadow: var(--shadow-pop); }
}

/* ===== Desktop ===== */
@media (min-width: 1024px) {
  .app { grid-template-columns: var(--sidebar-w) 1fr; }
  .app.collapsed { grid-template-columns: 76px 1fr; }
  .sidebar {
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; overflow-y: auto;
    padding: var(--s-5) var(--s-3); background: var(--bg-raised); border-right: 1px solid var(--border-soft);
  }
  .bottomnav { display: none; }
  .topbar { padding: 0 var(--s-8); min-height: 68px; }
  .view { padding: var(--s-4) var(--s-8) var(--s-10); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}
</style>
