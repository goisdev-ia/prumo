(function () {

  const TIPOS = { marca_texto: 'Marca-texto', marca: 'Destaque de área', sublinhado: 'Sublinhado', riscado: 'Riscado', caneta: 'Caneta', pincel: 'Pincel', linha: 'Linha', seta: 'Seta', retangulo: 'Retângulo', elipse: 'Elipse', texto: 'Caixa de texto', comentario: 'Comentário' };
  const TOOLS = [['ler', 'cursor-text', 'Ler e selecionar texto'], ['selecionar', 'pointer', 'Selecionar e mover'], ['marca_texto', 'highlighter', 'Marca-texto (selecione o texto)'], ['marca', 'square', 'Destacar área'], ['sublinhado', 'underline', 'Sublinhar (selecione o texto)'], ['riscado', 'strike', 'Riscar (selecione o texto)'], ['caneta', 'pen', 'Caneta'], ['pincel', 'brush', 'Pincel (marcador livre)'], ['linha', 'line', 'Linha'], ['seta', 'arrow-ur', 'Seta'], ['retangulo', 'square', 'Retângulo'], ['elipse', 'circle', 'Elipse'], ['texto', 'type', 'Caixa de texto'], ['comentario', 'comment', 'Comentário'], ['borracha', 'eraser', 'Borracha (apaga a marcação tocada)']];
  const DRAW = new Set(['selecionar', 'marca', 'caneta', 'pincel', 'linha', 'seta', 'retangulo', 'elipse', 'texto', 'comentario', 'borracha']);
  const TEXTUAL = new Set(['marca_texto', 'sublinhado', 'riscado']);
  const ROT = { 0: { R: [1, 0], D: [0, -1] }, 90: { R: [0, 1], D: [1, 0] }, 180: { R: [-1, 0], D: [0, 1] }, 270: { R: [0, -1], D: [-1, 0] } };
  const visitMap = {};

  // ================= IndexedDB (cache de arquivos e fila de anotações pendentes) =================
  const idb = (() => {
    let dbp = null; const mem = { files: new Map(), pend: new Map() };
    const open = () => dbp || (dbp = new Promise((res) => { try { const rq = indexedDB.open('prumo-estudos', 1); rq.onupgradeneeded = () => { rq.result.createObjectStore('files'); rq.result.createObjectStore('pend'); }; rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); } catch (e) { res(null); } }));
    const tx = async (store, mode, fn) => { const db = await open(); if (!db) return fn(null); return new Promise((res) => { try { const t = db.transaction(store, mode), st = t.objectStore(store); const rq = fn(st); t.oncomplete = () => res(rq && rq.result); t.onerror = () => res(undefined); } catch (e) { res(undefined); } }); };
    return {
      get: async (store, k) => { const v = await tx(store, 'readonly', (st) => (st ? st.get(k) : null)); return v === undefined || v === null ? mem[store].get(k) || null : v; },
      put: async (store, k, v) => { mem[store].set(k, v); if (store === 'pend') try { localStorage.setItem('prumo.estpend.' + k, '1'); } catch (e) { /* cheio */ } await tx(store, 'readwrite', (st) => (st ? st.put(v, k) : null)); },
      del: async (store, k) => { mem[store].delete(k); if (store === 'pend') try { localStorage.removeItem('prumo.estpend.' + k); } catch (e) { /* ok */ } await tx(store, 'readwrite', (st) => (st ? st.delete(k) : null)); },
      keys: async (store) => { const v = await tx(store, 'readonly', (st) => (st ? st.getAllKeys() : null)); return Array.from(new Set([...(v || []), ...mem[store].keys()])); }
    };
  })();

  // ================= bibliotecas =================
  let libP = null;
  function loadLib() {
    if (libP) return libP;

      if (!lib.GlobalWorkerOptions.workerSrc) {

  /** Bytes do arquivo (Drive → servidor em blocos), com cache no aparelho. */
  async function fetchBytes(arquivoId, onProgress) {
    const c = await idb.get('files', arquivoId);

    for (;;) {
      const r = await P.api.call('est.fileChunk', { arquivo_id: arquivoId, start, len: 3 * 1024 * 1024 }, { timeout: 180000 });

      if (!total || start >= total) break;

    return out;
  }

  // ================= geometria =================
  const bboxOf = (a) => {
    if (a.rect) return a.rect;
    if (a.rects && a.rects.length) return a.rects.reduce((b, r) => [Math.min(b[0], r[0]), Math.min(b[1], r[1]), Math.max(b[2], r[2]), Math.max(b[3], r[3])], [1e9, 1e9, -1e9, -1e9]);
    if (a.pts && a.pts.length) { let b = [1e9, 1e9, -1e9, -1e9]; for (let i = 0; i < a.pts.length; i += 2) b = [Math.min(b[0], a.pts[i]), Math.min(b[1], a.pts[i + 1]), Math.max(b[2], a.pts[i]), Math.max(b[3], a.pts[i + 1])]; const w = (a.espessura || 2) / 2; return [b[0] - w, b[1] - w, b[2] + w, b[3] + w]; }
    return [0, 0, 0, 0];
  };
  const normRect = (a, b) => [r2(Math.min(a[0], b[0])), r2(Math.min(a[1], b[1])), r2(Math.max(a[0], b[0])), r2(Math.max(a[1], b[1]))];
  /** Bordas de um retângulo de texto conforme a rotação própria da página (para sublinhar e riscar). */
  function edges(r, rot) {

    return { bottom, top, mid };
  }

    if (a.rect) a.rect = [r2(a.rect[0] + dx), r2(a.rect[1] + dy), r2(a.rect[2] + dx), r2(a.rect[3] + dy)];
    if (a.rects) a.rects = a.rects.map((r) => [r2(r[0] + dx), r2(r[1] + dy), r2(r[2] + dx), r2(r[3] + dy)]);
    if (a.pts) a.pts = a.pts.map((v, i) => r2(v + (i % 2 ? dy : dx)));
  };
  const winAnsi = (s) => String(s || '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x0A\x20-\x7E\xA0-\xFF–—•…€]/g, '?');
  const hexRgb = (hx) => { const m = String(hx || '#F2B705').replace('#', ''); const n = parseInt(m.length === 3 ? m.split('').map((c) => c + c).join('') : m.slice(0, 6), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
  function toRanges(set) { const a = [...set].map(Number).sort((x, y) => x - y), out = []; for (let i = 0; i < a.length; i++) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; out.push(j > i ? `${a[i]}-${a[j]}` : `${a[i]}`); i = j; } return out.join(', '); }

  // ================= leitor =================
  function open(m, o = {}) {

    const sh = ui.sheet({ title: m.titulo, size: 'full', wide: true, body: h`<div class="pdfv" data-v>
        <div class="pv-top"><button class="btn-icon sm" data-close aria-label="Fechar leitor">${icon('chev-l')}</button><div class="pv-title"><b class="ellipsis">${m.codigo} · ${m.titulo}</b><small data-state>carregando…</small><small class="pv-ocr" data-ocrst hidden></small></div>
          <button class="btn-icon sm" data-a="undo" aria-label="Desfazer" title="Desfazer (Ctrl+Z)">${icon('undo', 'sm')}</button><button class="btn-icon sm" data-a="redo" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)">${icon('redo', 'sm')}</button>
          <button class="btn-icon sm" data-a="side" data-p="busca" aria-label="Buscar no documento">${icon('search', 'sm')}</button><button class="btn-icon sm" data-a="side" data-p="marcas" aria-label="Painel lateral">${icon('panel', 'sm')}</button><button class="btn-icon sm" data-a="menu" aria-label="Mais opções">${icon('dots', 'sm')}</button></div>
        <div class="pv-tools" role="toolbar" aria-label="Ferramentas">${TOOLS.map(([k, ic, l]) => h`<button class="pv-tool ${k === 'ler' ? 'on' : ''}" data-tool="${k}" title="${l}" aria-label="${l}">${icon(ic, 'sm')}</button>`)}<span class="pv-sep"></span>
          ${CORES.map((c) => h`<button class="pv-sw ${c === V.cor ? 'on' : ''}" data-cor="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`)}<span class="pv-sep"></span>
          <label class="pv-mini">Traço<select data-esp>${[[0.75, 'fino'], [2, 'médio'], [4, 'grosso'], [8, 'extra']].map(([v, l]) => h`<option value="${v}" ${raw(v === 2 ? 'selected' : '')}>${l}</option>`)}</select></label>
          <label class="pv-mini">Opacidade<input type="range" min="15" max="100" value="100" data-opa></label></div>
        <div class="pv-body"><aside class="pv-side" data-side hidden></aside><div class="pv-scroll" data-scroll tabindex="0"><div class="pv-pages" data-pages><div class="skel" style="height:60vh;margin:24px"></div></div></div></div>

          <span class="grow"></span><input class="input sm num pv-pg" data-pg inputmode="numeric" aria-label="Página atual" value="1"><span class="faint" data-n>/ –</span><span class="grow"></span>
          <button class="btn-icon sm" data-a="fav" aria-label="Favoritar página">${icon('bookmark', 'sm')}</button><button class="btn-icon sm" data-a="eye" aria-label="Mostrar ou ocultar marcações">${icon('eye', 'sm')}</button><button class="btn-icon sm" data-a="read" aria-label="Modo leitura">${icon('book', 'sm')}</button></div>
        <div class="pv-pop" data-selmenu hidden></div><div class="pv-pop" data-objmenu hidden></div></div>`,
      onClose: () => close() });
    sh.root.classList.add('pdfv-sheet'); window.__estV = V;
    const $ = (s) => sh.el.querySelector(s), root = $('[data-v]'), scroller = $('[data-scroll]'), pagesEl = $('[data-pages]');
    const setState = (s, extra) => { V.state = s; const L = { carregando: 'carregando…', local: 'salvo neste aparelho', aguardando: 'aguardando envio', salvando: 'salvando…', salvo: 'salvo', falha: 'falha ao salvar: tentando de novo', conflito: 'conflito: escolha uma versão', offline: 'sem conexão: salvo neste aparelho' }; const el = $('[data-state]'); if (el) { el.textContent = (L[s] || s) + (extra ? ' · ' + extra : ''); el.className = 'st-' + s; } };

    // ---------- carregamento ----------
    (async () => {
      try {
        const [lib, bytes, g, pend] = await Promise.all([loadLib(), fetchBytes(m.arquivo_id, (p) => setState('carregando', Math.round(p * 100) + '%')), P.api.call('est.annGet', { material_id: m.id, arquivo_id: m.arquivo_id }, { timeout: 90000 }), idb.get('pend', key)]);
        if (!V.alive) return;
        V.doc = await lib.getDocument({ data: bytes.slice(0) }).promise; V.n = V.doc.numPages;
        V.rev = g.doc.revisao || 0; V.favs = { lista: g.doc.favoritos || [], rev: g.doc.favoritos_rev || 0 };
        Object.entries(g.doc.paginas || {}).forEach(([pg, x]) => { V.ann[pg] = { itens: x.itens || [] }; V.revs[pg] = x.rev; });
        V.exps = g.exportacoes || [];
        if (pend && pend.paginas) { V.pend = pend; Object.entries(pend.paginas).forEach(([pg, its]) => { V.ann[pg] = { itens: its }; }); if (pend.favoritos) V.favs.lista = pend.favoritos.lista; setState('aguardando'); send(); } else setState('salvo');
        const leit = E.readOf(m);
        V.cur = Math.min(V.n, Math.max(1, +o.pagina || (leit && +leit.pagina) || +localStorage.getItem('prumo.estpg.' + m.id) || 1));
        const p1 = await V.doc.getPage(1); V.base = p1.getViewport({ scale: 1 });
        V.scale = Math.min(1.6, Math.max(0.5, (scroller.clientWidth - 24) / V.base.width));
        $('[data-n]').textContent = '/ ' + V.n; $('[data-z]').textContent = Math.round(V.scale * 100) + '%';
        await layout(); goto(V.cur, true);
        if (o.pagina && leit && +leit.pagina && +leit.pagina !== +o.pagina) ui.toast(`Aberto na página ${o.pagina}. Você tinha parado na ${leit.pagina}.`, { action: { label: 'Voltar para ' + leit.pagina, fn: () => goto(+leit.pagina) }, duration: 8000 });
        ocrInit();
        setTimeout(() => extractText(), 4000);
      } catch (e) { console.error(e); pagesEl.innerHTML = P.toHtml(ui.empty({ ill: 'alert', title: 'Não consegui abrir o PDF', text: e.message || String(e), small: true })); setState('falha', 'abertura'); }
    })();

    // ---------- layout e renderização preguiçosa ----------
    let io = null;
    async function layout() {
      const keep = V.cur;
      pagesEl.innerHTML = '';
      if (io) io.disconnect();
      io = new IntersectionObserver((ents) => ents.forEach((en) => { const pg = V.pages[+en.target.dataset.pg - 1]; if (!pg) return; pg.vis = en.isIntersecting; if (en.isIntersecting) render(pg); else if (V.n > 24) unrender(pg); }), { root: scroller, rootMargin: '800px 0px' });
      V.pages = [];
      for (let i = 1; i <= V.n; i++) {
        const el = document.createElement('div'); el.className = 'pv-page'; el.dataset.pg = i;
        const pg = { i, el, page: null, vp: null, rendered: false, task: null };
        // tamanho provisório pela 1ª página; corrige ao carregar a página real
        const vb = V.base, r = (V.rot % 180) ? [vb.height, vb.width] : [vb.width, vb.height];
        el.style.width = r[0] * V.scale + 'px'; el.style.height = r[1] * V.scale + 'px';
        el.innerHTML = `<canvas class="pv-cv"></canvas><div class="textLayer"></div><svg class="pv-svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="pv-html"></div><div class="pv-ink"></div><span class="pv-num">${i}</span>`;
        pagesEl.appendChild(el); V.pages.push(pg); io.observe(el);
      }
      V.cur = keep;
    }
    async function ensurePage(pg) {
      if (!pg.page) pg.page = await V.doc.getPage(pg.i);
      const rot = ((pg.page.rotate || 0) + V.rot) % 360;
      pg.vp = pg.page.getViewport({ scale: V.scale, rotation: rot }); pg.prot = pg.page.rotate || 0;
      pg.el.style.width = pg.vp.width + 'px'; pg.el.style.height = pg.vp.height + 'px';
      const svg = pg.el.querySelector('svg'); svg.setAttribute('viewBox', `0 0 ${pg.vp.width} ${pg.vp.height}`); svg.setAttribute('width', pg.vp.width); svg.setAttribute('height', pg.vp.height);
      return pg;
    }
    async function render(pg) {
      if (pg.rendered || pg.busy) return; pg.busy = true;
      try {
        await ensurePage(pg); if (!V.alive) return;
        const dpr = Math.min(2, window.devicePixelRatio || 1), cv = pg.el.querySelector('canvas'), vp = pg.vp;
        cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr); cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
        if (pg.task) try { pg.task.cancel(); } catch (e) { /* ok */ }
        pg.task = pg.page.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
        await pg.task.promise.catch((e) => { if (e && e.name !== 'RenderingCancelledException') throw e; });
        const tl = pg.el.querySelector('.textLayer'); tl.innerHTML = ''; tl.style.setProperty('--scale-factor', V.scale);
        const tc = V.txt[pg.i] ? V.txt[pg.i].tc : await pg.page.getTextContent();
        if (!V.txt[pg.i]) V.txt[pg.i] = { tc, s: tc.items.map((x) => x.str).join(' ') };
        const lib = await loadLib();
        if (V.ocr[pg.i]) ocrLayer(pg); else await lib.renderTextLayer({ textContentSource: tc, container: tl, viewport: vp, textDivs: [] }).promise.catch(() => {});
        pg.rendered = true; drawAnn(pg); markHits(pg);
        if (!V.ocr[pg.i] && O.needsOcr(V.txt[pg.i].s.replace(/\s/g, '').length)) ocrWant(pg.i);
      } catch (e) { console.warn('render', pg.i, e); } finally { pg.busy = false; }
    }
    function unrender(pg) { if (!pg.rendered) return; const cv = pg.el.querySelector('canvas'); cv.width = 0; cv.height = 0; pg.el.querySelector('.textLayer').innerHTML = ''; pg.rendered = false; }
    async function relayout(keepPg) {
      const pgN = keepPg || V.cur; V.pages.forEach((p) => { p.rendered = false; p.vp = null; });
      $('[data-z]').textContent = Math.round(V.scale * 100) + '%';
      for (const p of V.pages) { const vb = p.page ? p.page.getViewport({ scale: V.scale, rotation: ((p.page.rotate || 0) + V.rot) % 360 }) : null; const r = vb ? [vb.width, vb.height] : ((V.rot % 180) ? [V.base.height * V.scale, V.base.width * V.scale] : [V.base.width * V.scale, V.base.height * V.scale]); p.el.style.width = r[0] + 'px'; p.el.style.height = r[1] + 'px'; }
      goto(pgN, true); V.pages.filter((p) => p.vis).forEach(render);
    }
    function goto(n, instant) { n = Math.max(1, Math.min(V.n, +n || 1)); const pg = V.pages[n - 1]; if (!pg) return; scroller.scrollTo({ top: pg.el.offsetTop - 8, behavior: instant ? 'auto' : 'smooth' }); setCur(n); }
    function setCur(n) {
      if (n === V.cur && V._curSet) return; V.cur = n; V._curSet = true; const inp = $('[data-pg]'); if (inp && document.activeElement !== inp) inp.value = n;
      try { localStorage.setItem('prumo.estpg.' + m.id, n); } catch (e) { /* ok */ }
      clearTimeout(V.visitT); V.visitT = setTimeout(() => V.visit.add(n), 1500);
      clearTimeout(V.readT); V.readT = setTimeout(saveReading, 6000);

    }
    const saveReading = () => P.api.call('est.readingSave', { material_id: m.id, pagina: V.cur, zoom: r2(V.scale), total_paginas: V.n }, { mutation: true }).then((r) => S.put('est_leitura', r.leitura)).catch(() => {});
    scroller.addEventListener('scroll', () => { if (!V.pages.length) return; const mid = scroller.scrollTop + scroller.clientHeight / 3; let best = 1; for (const p of V.pages) { if (p.el.offsetTop <= mid) best = p.i; else break; } setCur(best); hidePops(); }, { passive: true });

    // ---------- desenho das marcações ----------
    const pv = (pg, x, y) => pg.vp.convertToViewportPoint(x, y);
    const pp = (pg, x, y) => { const q = pg.vp.convertToPdfPoint(x, y); return [r2(q[0]), r2(q[1])]; };

      const line = (t, o2 = {}) => { const fs = o2.size || 10, f = o2.bold ? bold : font, maxW = A4[0] - 2 * M - (o2.indent || 0); const words = winAnsi(t).split(/\s+/); let cur = ''; const out = []; words.forEach((wd) => { const t2 = cur ? cur + ' ' + wd : wd; if (f.widthOfTextAtSize(t2, fs) > maxW && cur) { out.push(cur); cur = wd; } else cur = t2; }); out.push(cur); out.forEach((ln) => { if (y < M + fs) { pg = pdf.addPage(A4); y = A4[1] - M; } pg.drawText(ln, { x: M + (o2.indent || 0), y, size: fs, font: f, color: rgb(0.1, 0.1, 0.1) }); y -= fs * 1.35; }); };
      line(`${m.codigo} · ${m.titulo}`, { size: 14, bold: true }); line(`Cópia anotada · revisão ${doc.revisao} das anotações · gerada em ${fmt.date(P.d.today())}`, { size: 9 }); y -= 8;
      if (comments.length) { line('Comentários', { size: 12, bold: true }); comments.forEach((c) => { line(`${c.num}. Página ${c.n}`, { bold: true }); String(c.texto).split('\n').forEach((t) => line(t, { indent: 14 })); y -= 4; }); y -= 8; }
      if (favs.length) { line('Páginas favoritas', { size: 12, bold: true }); favs.forEach((f) => line(`Página ${f.pagina}: ${f.titulo || ''}`)); }
    }
    pdf.setProducer('Prumo'); pdf.setModificationDate(new Date());
    return pdf.save();
  }

  async function sendAnnotated(m) {
    if (!E.tg()) { ui.toast('Conecte o seu Telegram em Configurações › Telegram.', { error: true }); return; }
    try { const ex = await exportIfNeeded(m, { force: true }); if (!ex) return; await E.sendTg({ tipo: 'exportacao', id: ex.id }); }
    catch (e) { /* a mensagem já foi exibida */ }
  }

  /** Envia anotações que ficaram só no aparelho (sem abrir o leitor). Conflitos ficam para quando o material for aberto. */
  async function syncPending() {
    if (!P.auth || !P.auth.token || !P.auth.token() || navigator.onLine === false) return;
    const keys = await idb.keys('pend'); let ok = 0, falta = 0;
    for (const k of keys) { const p = await idb.get('pend', k); if (!p || !p.material_id) continue; const m = { id: p.material_id, arquivo_id: p.arquivo_id }; if (await syncPendingFor(m)) ok++; else falta++; }
    if (falta) ui.toast(`${falta} material(is) com anotações guardadas só neste aparelho. Abra-os para resolver.`, { duration: 8000 });
    return { ok, falta };
  }
  window.addEventListener('online', () => setTimeout(syncPending, 3000));
  setTimeout(() => { try { if (Object.keys(localStorage).some((k) => k.startsWith('prumo.estpend.'))) syncPending(); } catch (e) { /* ok */ } }, 12000);


  // ================= imprimir e baixar (original ou anotado, todas as páginas ou um intervalo) =================
  /** Bytes do PDF: original, ou com as marcações atuais desenhadas na hora (nunca uma cópia antiga). */
  async function bytesFor(m, variante, onStep) {
    const st = onStep || (() => {});
    st('Baixando o original…');
    const orig = await fetchBytes(m.arquivo_id);
    if (variante !== 'anotado') return { bytes: orig, rev: null };
    if (!(await syncPendingFor(m))) throw new Error('Há anotações deste material guardadas só neste aparelho. Abra o material para sincronizar antes de imprimir a versão anotada.');
    const g = await P.api.call('est.annGet', { material_id: m.id, arquivo_id: m.arquivo_id }, { timeout: 90000 });
    const tot = Object.values(g.doc.paginas || {}).reduce((a, x) => a + (x.itens || []).length, 0);
    if (!tot) throw new Error('Este material ainda não tem marcações: escolha o original.');
    st('Desenhando as marcações…');
    return { bytes: await build(m, g.doc, orig), rev: g.doc.revisao };
  }
  /** Só as páginas pedidas (ex.: "3-7, 10"), na ordem. */
  async function subset(bytes, range) {
    if (!range) return bytes;
    const { PDFDocument } = await E.lib('pdflib');
    const src = await PDFDocument.load(bytes, { updateMetadata: false, ignoreEncryption: true }), n = src.getPageCount(), idx = [];
    String(range).split(',').forEach((p) => { const [a, b] = p.split('-').map((z) => +String(z).trim()); if (!a) return; for (let i = a; i <= (b || a); i++) if (i >= 1 && i <= n && !idx.includes(i - 1)) idx.push(i - 1); });
    if (!idx.length) throw new Error('Nenhuma página válida nesse intervalo (o PDF tem ' + n + ' páginas).');
    const out = await PDFDocument.create(), pages = await out.copyPages(src, idx); pages.forEach((pg) => out.addPage(pg));
    return out.save();
  }
  function printSheet(m, o = {}) {
    if (!m || m.tipo !== 'pdf' || !m.arquivo_id) { ui.toast('Este material não tem PDF.', { error: true }); return null; }
    const st = { v: o.variante || 'original', modo: o.paginas ? 'intervalo' : 'todas', r: o.paginas || '' };
    const s = ui.sheet({ title: 'Imprimir ou baixar · ' + m.codigo, body: h`<div data-pb></div>`, foot: h`<button type="button" class="btn btn-ghost" data-dl>${icon('download', 'sm')}Baixar</button><button type="button" class="btn btn-primary" data-pr>${icon('file', 'sm')}Imprimir</button>` });
    const draw = () => {
      s.$('[data-pb]').innerHTML = P.toHtml(h`<div class="form">
        <div class="field full"><label>Versão</label><div class="seg" role="radiogroup"><button type="button" role="radio" aria-checked="${st.v === 'original'}" class="${st.v === 'original' ? 'on' : ''}" data-v="original">Original</button><button type="button" role="radio" aria-checked="${st.v === 'anotado'}" class="${st.v === 'anotado' ? 'on' : ''}" data-v="anotado">Com as marcações</button></div>
          <span class="hint">${st.v === 'anotado' ? 'Desenhada agora com as marcações atuais (não usa cópia antiga).' : 'O arquivo como foi enviado.'}</span></div>
        <div class="field full"><label>Páginas</label><div class="seg" role="radiogroup"><button type="button" role="radio" aria-checked="${st.modo === 'todas'}" class="${st.modo === 'todas' ? 'on' : ''}" data-m="todas">Todas${m.paginas ? ' (' + m.paginas + ')' : ''}</button><button type="button" role="radio" aria-checked="${st.modo === 'intervalo'}" class="${st.modo === 'intervalo' ? 'on' : ''}" data-m="intervalo">Intervalo</button></div>
          ${st.modo === 'intervalo' ? h`<input class="input mt-2" data-r value="${st.r}" placeholder="Ex.: 3-7, 10" inputmode="numeric" aria-label="Intervalo de páginas">` : ''}</div>
        <p class="faint full" data-stp style="font-size:12px"></p></div>`);
      s.$$('[data-v]').forEach((b) => { b.onclick = () => { st.v = b.dataset.v; draw(); }; });
      s.$$('[data-m]').forEach((b) => { b.onclick = () => { st.r = (s.$('[data-r]') || {}).value || st.r; st.modo = b.dataset.m; draw(); }; });
    };
    const go = async (acao, btn) => {
      const r = st.modo === 'intervalo' ? ((s.$('[data-r]') || {}).value || '').trim() : '';
      if (st.modo === 'intervalo' && !/^\s*\d+(\s*-\s*\d+)?(\s*,\s*\d+(\s*-\s*\d+)?)*\s*$/.test(r)) { ui.toast('Use páginas como 3-7, 10.', { error: true }); return; }
      btn.classList.add('loading'); const stp = (t) => { const el = s.$('[data-stp]'); if (el) el.textContent = t; };
      try {
        const b0 = await bytesFor(m, st.v, stp); stp(r ? 'Separando as páginas ' + r + '…' : '');
        const out = await subset(b0.bytes, r);
        const nome = `${m.codigo}_${String(m.titulo).replace(/[^\w\-]+/g, '_').slice(0, 50)}${st.v === 'anotado' ? '_anotado_rev' + b0.rev : ''}${r ? '_p' + r.replace(/\s/g, '').replace(/,/g, '_') : ''}.pdf`;
        if (acao === 'imprimir') P.rep.print(out, nome); else { P.rep.save(out, nome, 'application/pdf'); ui.toast('PDF baixado: ' + nome, { icon: 'download' }); }
        s.close();
      } catch (e) { stp(''); ui.toast(e.message || String(e), { error: true }); } finally { btn.classList.remove('loading'); }
    };
    s.$('[data-pr]').onclick = (ev) => go('imprimir', ev.currentTarget);
    s.$('[data-dl]').onclick = (ev) => go('baixar', ev.currentTarget);
    draw();
    return s;
  }

  P.estPdf = { _V: () => window.__estV, open: (m, o) => E.ensure().then(() => open(m, o)), loadLib, fetchBytes, visited: (mid) => toRanges(visitMap[mid] || new Set()), exportIfNeeded, sendAnnotated, syncPending, printSheet, bytesFor, subset, _build: build, _edges: edges };
})();
</script>
