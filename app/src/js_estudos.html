<script>
/* Prumo · Estudos (concursos públicos): núcleo, painel, concursos e etapas, edital verticalizado e planejamento.
   Os dados de Estudos carregam sob demanda (rota est.boot) para não pesar a abertura do app. */
(function () {
  'use strict';
  const P = window.Prumo;
  const { h, raw, icon, fmt, d: D, store: S, ui } = P;
  const T_EST = ['est_concursos', 'est_etapas', 'est_editais', 'est_disciplinas', 'est_assuntos', 'est_edital_itens', 'est_planos', 'est_ciclo_itens', 'est_sessoes', 'est_materiais', 'est_leitura', 'est_pdf_anot', 'est_exportacoes', 'est_anotacoes', 'est_questoes', 'est_tentativas', 'est_listas', 'est_simulados', 'est_simulado_itens', 'est_revisoes', 'est_flashcards', 'est_flashcard_revisoes', 'est_erros', 'est_discursivas', 'est_jobs', 'tar_tarefas', 'met_metas'];
  const SIT = { previsto: ['Previsto', ''], autorizado: ['Autorizado', 'info'], edital_publicado: ['Edital publicado', 'info'], inscricoes_abertas: ['Inscrições abertas', 'up'], preparacao: ['Em preparação', 'up'], prova_realizada: ['Prova realizada', ''], encerrado: ['Encerrado', ''] };
  const DSTAT = { confirmada: 'confirmada', estimada: 'estimada', indefinida: 'a confirmar' };
  const ETAPA = { inscricao: 'Inscrição', pagamento: 'Pagamento', documentos: 'Documentos', cartao: 'Cartão de inscrição', objetiva: 'Prova objetiva', discursiva: 'Prova discursiva', teste_fisico: 'Teste físico', titulos: 'Avaliação de títulos', pratica: 'Prova prática', resultado: 'Resultado', outra: 'Outra etapa' };
  const TEORIA = { nao_iniciada: ['Não iniciada', ''], em_andamento: ['Em andamento', 'info'], concluida: ['Concluída', 'up'] };
  const TIPO_SES = { teoria: 'Teoria', questoes: 'Questões', revisao: 'Revisão', simulado: 'Simulado', discursiva: 'Discursiva', leitura: 'Leitura', aula: 'Aula' };
  const st = { conc: null, edFiltro: 'todos', edQ: '', planId: null, sug: null, sel: null };

  // ================= Núcleo =================
  const E = P.est = {
    loaded: false, loading: null, ia: null, T: T_EST, TIPO_SES, TEORIA, SIT, DSTAT, ETAPA,
    /** Carrega as tabelas de Estudos (uma vez). */
    ensure() {
      if (E.loaded) return Promise.resolve();
      if (!E.loading) {
        E.loading = P.api.call('est.boot', {}, { timeout: 120000, retries: 1 }).then((r) => {
          S.load(r.tables); E.ia = r.ia; E.loaded = true;
          if (P.bootInfo) P.bootInfo.windows = Object.assign(P.bootInfo.windows || {}, r.windows || {});
          P.router.refresh(Object.keys(r.tables));
        }).catch((e) => { E.loading = null; throw e; });
      }
      return E.loading;
    },
    /** Tela que depende dos dados: mostra esqueleto e carrega. */
    gate() {
      if (E.loaded) return null;
      E.ensure().then(() => P.router.render(true)).catch((e) => { ui.toast(e.message, { error: true }); });
      return h`<div class="page-head"><div><h1>Estudos</h1><p>Carregando seus estudos…</p></div></div>${ui.skeleton()}`;
    },
    disc: (id) => S.getAny('est_disciplinas', id), ass: (id) => S.getAny('est_assuntos', id), conc: (id) => S.getAny('est_concursos', id), mat: (id) => S.getAny('est_materiais', id),
    discNome: (id) => (S.getAny('est_disciplinas', id) || {}).nome || '',
    assNome: (id) => (S.getAny('est_assuntos', id) || {}).titulo || '',
    discCor: (id) => (S.getAny('est_disciplinas', id) || {}).cor || 'var(--primary)',
    concursos: () => S.all('est_concursos').filter((c) => !c.arquivado).sort((a, b) => (b.principal ? 1 : 0) - (a.principal ? 1 : 0) || (a.prioridade || 2) - (b.prioridade || 2) || String(a.nome).localeCompare(b.nome)),
    principal: () => S.all('est_concursos').find((c) => c.principal && !c.arquivado) || E.concursos()[0] || null,
    /** Concurso do contexto (null = visão consolidada). */
    ctx: () => (st.conc === null ? (E.principal() ? E.principal().id : '') : st.conc),
    setCtx: (id) => { st.conc = id; },
    disciplinas: () => S.all('est_disciplinas').sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || a.nome.localeCompare(b.nome)),
    assuntosDe: (did) => S.where('est_assuntos', (a) => a.disciplina_id === did).sort((a, b) => (a.ordem || 0) - (b.ordem || 0)),
    editalAtivo: (cid) => S.where('est_editais', (e) => e.concurso_id === cid && e.ativo).sort((a, b) => b.versao - a.versao)[0] || null,
    itensDo: (eid) => S.where('est_edital_itens', (x) => x.edital_id === eid).sort((a, b) => (a.ordem || 0) - (b.ordem || 0)),
    res: (t) => t.resultado_atual || t.resultado,
    /** Domínio (critério visível): precisão nas últimas 20 respondidas do assunto, mínimo 10. */
    mastery(aid) {
      const qs = new Set(S.where('est_questoes', (q) => q.assunto_id === aid).map((q) => q.id));
      const v = S.where('est_tentativas', (t) => qs.has(t.questao_id) && ['certa', 'errada'].includes(E.res(t))).sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(0, 20);
      if (v.length < 10) return { nivel: 'sem_dados', n: v.length, pct: null };
      const p = Math.round((v.filter((t) => E.res(t) === 'certa').length / v.length) * 100);
      return { nivel: p >= 80 ? 'alto' : p >= 60 ? 'medio' : 'baixo', n: v.length, pct: p };
    },
    masteryChip(m) {
      const L = { alto: ['Domínio alto', 'up'], medio: ['Domínio médio', 'info'], baixo: ['Domínio baixo', 'down'], sem_dados: ['Sem dados', ''] }[m.nivel];
      return h`<span class="chip ${L[1]}" title="Precisão nas últimas ${m.n} respostas válidas (mínimo 10). Alto ≥ 80 %, médio 60–79 %, baixo < 60 %.">${L[0]}${m.pct != null ? ' · ' + m.pct + '%' : m.n ? ' (' + m.n + '/10)' : ''}</span>`;
    },
    /** Estatística de questões de um conjunto de tentativas. */
    qstats(tents) {
      const o = { total: tents.length, certas: 0, erradas: 0, brancos: 0, anuladas: 0, sem: 0 };
      tents.forEach((t) => { const r = E.res(t); if (r === 'certa') o.certas++; else if (r === 'errada') o.erradas++; else if (r === 'branco') o.brancos++; else if (r === 'anulada') o.anuladas++; else o.sem++; });
      o.resp = o.certas + o.erradas; o.prec = o.resp ? Math.round((o.certas / o.resp) * 1000) / 10 : null; o.pequena = o.resp < 30;
      return o;
    },
    precText: (o) => (o.prec == null ? 'sem dados' : `${fmt.num(o.prec, 1)}% (${o.resp} resp.${o.pequena ? ', amostra pequena' : ''})`),
    /** Cobertura (cliente; mesma regra do servidor): folhas do edital ativo, sem retirados. */
    coverage(cid) {
      const ed = cid ? E.editalAtivo(cid) : null;
      if (!ed) return { total: 0, pct: null, pond: null, ed: null };
      const its = E.itensDo(ed.id).filter((x) => x.alteracao !== 'retirado');
      const folhas = its.filter((x) => !its.some((y) => { const a = E.ass(y.assunto_id); return a && a.pai_id === x.assunto_id; }));
      const w = (x) => +x.qtd_questoes || +x.peso || 1;
      const feitos = folhas.filter((x) => (E.ass(x.assunto_id) || {}).teoria === 'concluida');
      const tot = P.sum(folhas, w), fe = P.sum(feitos, w);
      return { total: folhas.length, concluidos: feitos.length, pct: folhas.length ? Math.round((feitos.length / folhas.length) * 1000) / 10 : null, pond: tot ? Math.round((fe / tot) * 1000) / 10 : null, ed, folhas, feitos };
    },
    open: () => S.all('est_sessoes').find((s) => s.status === 'aberta' || s.status === 'pausada') || null,
    /** Tempo líquido (s) de uma sessão até agora, a partir dos horários persistidos. */
    liveSecs(s) {
      if (!s) return 0;
      if (s.status === 'encerrada') return +s.liquido_s || 0;
      const now = Date.now(), ini = new Date(s.inicio).getTime();
      const pausas = (s.pausas_json || []).reduce((a, p) => (p[0] === 'manual' ? a + (+p[1] || 0) * 1000 : a + ((p[1] ? new Date(p[1]).getTime() : now) - new Date(p[0]).getTime())), 0);
      return Math.max(0, Math.round((now - ini - pausas) / 1000));
    },
    studyTasks: () => S.where('tar_tarefas', (t) => !t.pai_id && (t.est_tipo || t.est_disciplina_id || t.est_assunto_id)),
    revHoje: () => S.where('est_revisoes', (r) => r.status === 'pendente' && r.vencimento <= D.today()),
    tg: () => { const s = P.settings.get('tg.chat_id', ''); return !!s; },
    /** Envia ao Telegram pela fila do servidor (destino = chat vinculado). */
    async sendTg(payload, btn) {
      if (btn) btn.classList.add('loading');
      try {
        const r = await P.api.call('est.tgSend', { ...payload, op_key: P.uuid() }, { mutation: true, timeout: 120000 });
        const j = r.job; S.put('est_jobs', j);
        if (j.status === 'enviado') ui.toast(`Enviado ao Telegram (${j.codigo}). O Telegram aceitou a mensagem.`, { icon: 'message' });
        else if (j.status === 'falhou' && j.proxima) ui.toast(`Pedido ${j.codigo} na fila: ${j.erro || 'nova tentativa em instantes'}`);
        else if (j.status === 'falhou') ui.toast(j.erro || 'Não foi possível enviar.', { error: true });
        else ui.toast(`Pedido ${j.codigo}: ${String(j.status).replace('_', ' ')}`);
        return j;
      } catch (e) { ui.toast(e.message, { error: true }); return null; } finally { if (btn) btn.classList.remove('loading'); }
    },
    tgBtn: (act, data = {}, label = 'Enviar para meu Telegram') => h`<button type="button" class="btn btn-ghost btn-sm" data-act="${act}" ${raw(Object.entries(data).map(([k, v]) => `data-${P.esc(k)}="${P.esc(v)}"`).join(' '))}>${icon('message', 'sm')}${label}</button>`,
    /** Upload em partes (até 50 MB) com hash SHA-256 e retomada da parte que falhou. */
    async upload(file, o = {}) {
      const max = 50 * 1024 * 1024;
      if (file.size > max) throw new Error('Arquivo acima de 50 MB.');
      const buf = await file.arrayBuffer();
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      const hash = Array.from(new Uint8Array(hashBuf)).map((b) => b.toString(16).padStart(2, '0')).join('');
      const mime = file.type || (/\.xlsx$/i.test(file.name) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : /\.csv$/i.test(file.name) ? 'text/csv' : /\.pdf$/i.test(file.name) ? 'application/pdf' : '');
      const s0 = await P.api.call('est.upStart', { nome: file.name, mime, tamanho: file.size, hash, destino: o.destino || 'originais', substituir: o.substituir || null }, { mutation: true });
      if (s0.duplicado) return s0;
      const bytes = new Uint8Array(buf), chunk = s0.chunk;
      let off = 0, tries = 0, last = null;
      while (off < bytes.length) {
        const part = bytes.subarray(off, Math.min(bytes.length, off + chunk));
        let b64 = '';
        for (let i = 0; i < part.length; i += 0x8000) b64 += String.fromCharCode.apply(null, part.subarray(i, i + 0x8000));
        try {
          const r = await P.api.call('est.upChunk', { upload_id: s0.upload_id, offset: off, base64: btoa(b64) }, { mutation: true, timeout: 180000 });
          if (r.esperado != null) { off = r.esperado; continue; }
          off += part.length; tries = 0; last = r;
          if (o.onProgress) o.onProgress(Math.min(1, off / bytes.length));
        } catch (e) { if (++tries > 3) throw e; await P.sleep(1500 * tries); }
      }
      return last;
    },
    CATS: { questoes: 'Questões', revisoes: 'Revisões', teoria: 'Teoria', flashcards: 'Flashcards', outros: 'Outros' },
    /** Pergunta a categoria (obrigatória) e o concurso antes de guardar arquivos na biblioteca. */
    askUpload(files, meta = {}) {
      const plan = files.some((f) => /\.(xlsx|xls|csv)$/i.test(f.name)), sug = meta.categoria || (plan ? 'questoes' : '');
      const cs = E.concursos(), conc0 = String(meta.concurso_ids || '').split(',')[0] || E.ctx() || '';
      return new Promise((res) => {
        ui.sheet({ title: files.length > 1 ? `Guardar ${files.length} arquivos` : 'Guardar na biblioteca', onClose: () => res(null),
          body: h`<p class="muted" style="font-size:13px">${files.map((f) => f.name).join(', ')}</p>
            <div class="field mt-3"><label>Categoria *</label><div class="row-sm wrap" data-cats>${Object.entries(E.CATS).map(([k, l]) => h`<button type="button" class="fchip ${k === sug ? 'on' : ''}" data-cat="${k}">${l}</button>`)}</div>${plan ? h`<span class="hint">Planilha: sugerimos Questões; confirme ou troque.</span>` : ''}</div>
            <div class="field mt-3"><label>Concurso</label><select class="input" data-conc><option value="">Geral (nenhum)</option>${cs.map((c) => h`<option value="${c.id}" ${raw(c.id === conc0 ? 'selected' : '')}>${c.nome}</option>`)}</select></div>
            <p class="faint mt-3" style="font-size:12px">No Drive: Estudos / tipo do arquivo / concurso / data do envio / categoria.</p>`,
          foot: h`<button class="btn btn-primary grow" data-ok>Guardar</button>`,
          onMount(sh) {
            let cat = sug;
            sh.$('[data-cats]').onclick = (e) => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; P.$$('[data-cat]', sh.el).forEach((x) => x.classList.toggle('on', x === b)); };
            sh.$('[data-ok]').onclick = () => { if (!cat) { ui.toast('Escolha a categoria.', { error: true }); return; } const c = sh.$('[data-conc]').value; res({ ...meta, categoria: cat, concurso_ids: c || meta.concurso_ids || '' }); sh.close(); };
          } });
      });
    },
    /** Botões de upload → biblioteca. Devolve materiais criados. */
    async uploadToLibrary(files, meta = {}) {
      const out = [];
      if (!meta.categoria) { meta = await E.askUpload(files, meta); if (!meta) return out; }
      for (const f of files) {
        const t = ui.toast(`Enviando ${f.name}…`, { duration: 600000 });
        try {
          const r = await E.upload(f, { onProgress: (p) => t.set(`Enviando ${f.name}… ${Math.round(p * 100)}%`) });
          if (r.duplicado) { ui.toast(r.material ? `${f.name} já está na biblioteca (${r.material.codigo}).` : `${f.name} já foi enviado antes.`); if (r.material) out.push(r.material); continue; }
          const m = await P.api.call('est.materialSave', { ...meta, titulo: meta.titulo || f.name.replace(/\.[^.]+$/, ''), arquivo_id: r.arquivo.id }, { mutation: true });
          S.put('arquivos', r.arquivo); S.put('est_materiais', m.material); out.push(m.material);
          ui.toast(`${m.material.codigo} · ${m.material.titulo} na biblioteca`, { icon: 'check' });
        } catch (e) { ui.toast(`${f.name}: ${e.message}`, { error: true }); } finally { if (t && t.close) t.close(); }
      }
      // planilha guardada em Questões/Flashcards: oferece a importação (conferência → só linhas válidas)
      const pl = out.find((m) => m.tipo === 'xlsx' && (m.categoria === 'questoes' || m.categoria === 'flashcards'));
      if (pl && P.estQ && !meta.semOferta) ui.toast(`${pl.codigo}: importar ${pl.categoria === 'questoes' ? 'as questões' : 'os cartões'} desta planilha?`, { action: { label: 'Importar', fn: () => P.estQ.importer(pl.categoria, { materialId: pl.id }) }, duration: 12000 });
      return out;
    },
    /** Carrega scripts externos sob demanda (PDF.js, pdf-lib, SheetJS). */
    lib(name) {
      const L = {
        pdfjs: ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', () => window.pdfjsLib],
        pdflib: ['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', () => window.PDFLib],
        xlsx: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', () => window.XLSX]
      }[name];
      E._libs = E._libs || {};
      if (L[1]()) return Promise.resolve(L[1]());
      if (!E._libs[name]) E._libs[name] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = (E.LIB_BASE || '') + L[0].replace(E.LIB_BASE ? 'https://cdnjs.cloudflare.com/ajax/libs/' : '', ''); s.onload = () => res(L[1]()); s.onerror = () => { E._libs[name] = null; rej(new Error('Não foi possível carregar o componente (' + name + '). Verifique a conexão.')); }; document.head.appendChild(s); });
      return E._libs[name];
    },
    fieldsCtx: (o = {}) => [
      { k: 'concurso_id', l: 'Concurso', t: 'select', half: true, ph: 'Nenhum', opts: () => E.concursos().map((c) => [c.id, c.nome]) },
      { k: 'disciplina_id', l: 'Disciplina', t: 'select', half: true, ph: 'Nenhuma', opts: () => E.disciplinas().map((d) => [d.id, d.nome]) },
      { k: 'assunto_id', l: 'Assunto', t: 'select', ph: 'Nenhum', opts: (v) => (v.disciplina_id ? E.assuntosDe(v.disciplina_id) : S.all('est_assuntos')).map((a) => [a.id, (a.pai_id ? '— ' : '') + a.titulo]), ...(o.assunto || {}) }
    ],
    deps: T_EST
  };
  // Carrega Estudos em segundo plano depois da abertura (Início, busca e Metas ficam completos).
  setTimeout(() => { if (P.auth && P.auth.token() && P.me) E.ensure().catch(() => {}); }, 2500);

  const back = (to, label) => h`<a href="#/${to}" class="muted row-sm" style="font-size:13px">${icon('chev-l', 'xs')}${label}</a>`;
  const countdown = (d) => { if (!d) return null; const n = D.diff(D.today(), d); return n; };
  const concLabel = (c) => {
    if (!c.data_prova) return 'Data da prova a confirmar';
    const n = countdown(c.data_prova);
    return `Prova ${fmt.date(c.data_prova)} (${DSTAT[c.data_prova_status] || 'a confirmar'})${n >= 0 ? ` · faltam ${n} dia${n === 1 ? '' : 's'}` : ''}`;
  };
  const concChips = (act = 'est.ctx') => {
    const cs = E.concursos(), cur = E.ctx();
    if (!cs.length) return '';
    return h`<div class="chips" role="group" aria-label="Concurso">${[['', 'Todos (consolidado)']].concat(cs.map((c) => [c.id, c.nome])).map(([v, l]) => h`<button type="button" class="fchip ${String(cur) === String(v) ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`)}</div>`;
  };
  const inCtx = (o) => { const c = E.ctx(); return !c || !o.concurso_id || o.concurso_id === c; };

  // ================= Painel =================
  const CARDS = [['hoje', 'Hoje'], ['horas', 'Horas da semana'], ['questoes', 'Questões'], ['g_assert', 'Gráfico: assertividade × erro'], ['g_questoes', 'Gráfico: certas × erradas por semana'], ['g_horas', 'Gráfico: horas de estudo × meta'], ['g_disc', 'Gráfico: precisão por disciplina'], ['cobertura', 'Edital'], ['dificuldades', 'Dificuldades'], ['simulado', 'Último simulado'], ['prazos', 'Próximos prazos'], ['materiais', 'Últimos materiais']];
  function cardOrder() {
    const pref = P.settings.get('est.painel', null) || {};
    const ord = (pref.ordem || []).filter((k) => CARDS.some((c) => c[0] === k));
    CARDS.forEach((c) => { if (!ord.includes(c[0])) ord.push(c[0]); });
    return ord.filter((k) => !(pref.ocultos || []).includes(k));
  }

  function proximo() {
    const plano = S.all('est_planos').find((p) => p.ativo !== false && (!E.ctx() || !p.concurso_id || p.concurso_id === E.ctx()));
    const t = E.studyTasks().filter((x) => x.status !== 'feito' && x.status !== 'cancelada' && x.data_vencimento && x.data_vencimento <= D.today()).sort((a, b) => (a.data_vencimento < b.data_vencimento ? -1 : 1))[0];
    if (t) return { kind: 'tarefa', titulo: t.titulo, t };
    if (plano) {
      const ciclo = S.where('est_ciclo_itens', (c) => c.plano_id === plano.id).sort((a, b) => a.ordem - b.ordem);
      if (ciclo.length) { const c = ciclo[(+plano.ciclo_pos || 0) % ciclo.length]; return { kind: 'ciclo', titulo: `${TIPO_SES[c.tipo] || 'Estudo'} · ${E.discNome(c.disciplina_id)}`, c, plano }; }
    }
    return null;
  }

  function painel() {
    const g = E.gate(); if (g) return g;
    const cid = E.ctx(), conc = cid ? E.conc(cid) : null, today = D.today();
    const aberta = E.open(), prox = proximo();
    const lastSess = S.where('est_sessoes', (s) => s.status === 'encerrada' && s.material_id).sort((a, b) => (a.fim < b.fim ? 1 : -1))[0];
    const lastRead = S.all('est_leitura').sort((a, b) => ((a.atualizado || '') < (b.atualizado || '') ? 1 : -1))[0];
    const cont = lastRead && E.mat(lastRead.material_id) ? { mat: E.mat(lastRead.material_id), pagina: lastRead.pagina } : lastSess ? { mat: E.mat(lastSess.material_id), pagina: lastSess.pagina_fim } : null;
    const empty = !S.all('est_concursos').length && !S.all('est_disciplinas').length;
    if (empty) {
      return h`<div class="page-head"><div><h1>Estudos</h1><p>Preparação para concursos públicos</p></div></div>
        <div class="card pad-lg tint onboard"><span class="tile">${icon('book')}</span><div><b>Primeiro uso</b>
          <ol class="muted mt-2" style="font-size:13.5px;line-height:1.7;padding-left:18px"><li>Cadastre o concurso (órgão, cargo, banca e data da prova).</li><li>Monte o edital verticalizado: cole o conteúdo programático ou importe uma planilha.</li><li>Informe sua disponibilidade em Planejamento e gere o cronograma.</li></ol>

        <a class="li tap mt-2" href="#/est/revisoes"><span class="tile sm">${icon('refresh', 'sm')}</span><span class="main"><span class="t">${revH.length} revisão(ões) para hoje</span><span class="s">${revH.filter((r) => r.vencimento < today).length} atrasada(s)</span></span>${icon('chev-r', 'sm faint')}</a></div>`,

      cobertura: h`<button type="button" class="card span-4 link" data-act="${cov.ed ? 'ui.go' : 'est.concNew'}" data-to="est/edital" style="text-align:left"><div class="card-head">${icon('layers')}<h3>Edital</h3></div>
        ${cov.ed ? h`<div class="kv"><span>Cobertura (teoria concluída)</span><b>${cov.pct == null ? '—' : fmt.num(cov.pct, 1) + '%'}</b></div><div class="kv"><span>Ponderada pelo peso</span><b>${cov.pond == null ? '—' : fmt.num(cov.pond, 1) + '%'}</b></div>${ui.progress(cov.pct || 0)}<p class="faint mt-2" style="font-size:12px">${cov.concluidos} de ${cov.total} assuntos · v${cov.ed.versao}. Cobertura mede conteúdo visto; tempo e domínio são medidos à parte.</p>` : h`<p class="muted" style="font-size:13px">${cid ? 'Cadastre o edital deste concurso.' : 'Escolha um concurso para ver a cobertura.'}</p>`}</button>`,
      dificuldades: h`<div class="card span-4"><div class="card-head">${icon('alert')}<h3>Dificuldades</h3></div>${dif.length ? h`<div class="list">${dif.map((x) => h`<button type="button" class="li tap" data-act="est.assunto" data-id="${x.a.id}" style="width:100%;text-align:left"><span class="main"><span class="t">${x.a.titulo}</span><span class="s">${E.discNome(x.a.disciplina_id)}</span></span>${E.masteryChip(x.m)}</button>`)}</div>` : h`<p class="muted" style="font-size:13px">Nenhum assunto com domínio baixo (precisa de 10+ respostas por assunto).</p>`}</div>`,
      simulado: h`<div class="card span-4"><div class="card-head">${icon('flag')}<h3>Último simulado</h3><a class="link-btn" href="#/est/simulados">Ver todos</a></div>${sim ? (() => { const t = (sim.resultado_json || {}).total || {}; return h`<b>${sim.titulo}</b><p class="muted" style="font-size:13px">${fmt.date(String(sim.fim).slice(0, 10))} · nota ${fmt.num(t.nota, 2)} de ${fmt.num(t.max, 2)} (${t.pct == null ? '—' : fmt.num(t.pct, 1) + '%'})</p><p class="faint" style="font-size:12px">${t.acertos} certas · ${t.erros} erradas · ${t.brancos} em branco${t.anuladas ? ' · ' + t.anuladas + ' anuladas' : ''}</p>`; })() : h`<p class="muted" style="font-size:13px">Nenhum simulado feito.</p>`}</div>`,
      prazos: h`<div class="card span-4"><div class="card-head">${icon('calendar')}<h3>Próximos prazos</h3></div>${prazos.length ? h`<div class="list">${prazos.map((e) => h`<a class="li tap" href="#/est/concurso/${e.concurso_id}"><span class="main"><span class="t">${e.titulo}</span><span class="s">${fmt.date(e.data)}${e.hora ? ' ' + e.hora : ''} · ${DSTAT[e.data_status]}</span></span><span class="chip">${D.diff(today, e.data)} d</span></a>`)}</div>` : h`<p class="muted" style="font-size:13px">Sem prazos cadastrados.</p>`}</div>`,
      g_assert: (() => { const a = dash.acc; return h`<div class="card span-6"><div class="card-head">${icon('target')}<h3>Assertividade × erro</h3><a class="link-btn" href="#/est/questoes">Questões</a></div>
        <div class="row-sm wrap" style="align-items:center"><div style="flex:1 1 160px;min-width:160px" data-ch="assert"></div><div class="stack-sm" style="flex:1 1 140px">${ui.metric({ label: 'Acertos', value: a.pct == null ? 'sem dados' : fmt.num(a.pct, 1) + '%', size: 'md', cls: 'pos', sub: `${a.certas} certa(s)` })}${ui.metric({ label: 'Erros', value: a.pct == null ? 'sem dados' : fmt.num(100 - a.pct, 1) + '%', size: 'md', sub: `${a.erradas} errada(s) · ${a.ineditas} não respondida(s)` })}</div></div>
        <p class="faint mt-2" style="font-size:12px">Última resposta de cada questão${cid ? ' deste concurso' : ''}.</p></div>`; })(),
      g_questoes: h`<div class="card span-6"><div class="card-head">${icon('chart')}<h3>Certas × erradas por semana</h3></div><div data-ch="qsem"></div><p class="faint mt-2" style="font-size:12px">Todas as respostas registradas nas últimas 8 semanas (treino, avaliação, simulado e Telegram).</p></div>`,
      g_horas: h`<div class="card span-6"><div class="card-head">${icon('clock')}<h3>Horas de estudo × meta</h3><button type="button" class="link-btn" data-act="est.metaHoras">${dash.meta ? 'Meta: ' + fmt.num(dash.meta, dash.meta % 1 ? 1 : 0) + ' h/semana' : 'Definir meta semanal'}</button></div><div data-ch="horas"></div><p class="faint mt-2" style="font-size:12px">Tempo líquido por semana (pausas descontadas)${dash.meta ? '; a linha tracejada é a meta' : ''}.</p></div>`,
      g_disc: h`<div class="card span-6"><div class="card-head">${icon('list')}<h3>Precisão por disciplina</h3></div><div data-ch="disc"></div><p class="faint mt-2" style="font-size:12px">Certas ÷ (certas + erradas), última resposta de cada questão.</p></div>`,
      materiais: h`<div class="card span-6"><div class="card-head">${icon('book')}<h3>Últimos materiais</h3><a class="link-btn" href="#/est/biblioteca">Biblioteca</a></div>${mats.length ? h`<div class="list">${mats.map((m) => h`<button type="button" class="li tap" data-act="est.matOpen" data-id="${m.id}" style="width:100%;text-align:left"><span class="tile sm">${icon(m.tipo === 'pdf' ? 'file' : m.tipo === 'link' ? 'link' : 'book', 'sm')}</span><span class="main"><span class="t">${m.codigo} · ${m.titulo}</span><span class="s">${E.discNome(m.disciplina_id) || 'Sem disciplina'}</span></span></button>`)}</div>` : h`<p class="muted" style="font-size:13px">Biblioteca vazia.</p>`}</div>`
    };
    return h`<div class="page-head"><div><h1>Estudos</h1><p>${conc ? `${conc.nome}${conc.cargo ? ' · ' + conc.cargo : ''}${conc.banca ? ' · ' + conc.banca : ''}` : 'Visão consolidada'}</p></div>
        <div class="row-sm"><button class="btn btn-ghost btn-sm" data-act="est.painelCfg" aria-label="Personalizar painel">${icon('sliders', 'sm')}<span class="hide-m">Personalizar</span></button></div></div>
      ${concChips()}
      <div class="card pad-lg mt-3 est-hero">
        <div class="grow">${conc ? h`<b style="font-size:17px">${conc.nome}</b><p class="muted mt-2" style="font-size:13.5px">${concLabel(conc)}${conc.data_fonte ? ' · fonte: ' + conc.data_fonte : ''}</p>` : h`<b>Todos os concursos</b>`}
          ${prox ? h`<p class="mt-2" style="font-size:13.5px">${icon('arrow-r', 'xs')} Próximo: <b>${prox.titulo}</b></p>` : ''}</div>
        <div class="row-sm wrap">
          ${aberta ? h`<a class="btn btn-primary" href="#/est/sala">${icon('timer', 'sm')}Sessão aberta · <span class="num" data-live-session>${fmt.dur(E.liveSecs(aberta))}</span></a>`
            : h`<button class="btn btn-primary" data-act="est.start" ${raw(prox && prox.kind === 'tarefa' ? `data-tarefa="${P.esc(prox.t.id)}"` : prox && prox.kind === 'ciclo' ? `data-disc="${P.esc(prox.c.disciplina_id)}"` : '')}>${icon('play', 'sm')}Iniciar estudo</button>`}
          ${cont && cont.mat ? h`<button class="btn btn-ghost" data-act="est.matOpen" data-id="${cont.mat.id}">${icon('book', 'sm')}Continuar de onde parei · ${cont.mat.codigo}${cont.pagina ? ' p. ' + cont.pagina : ''}</button>` : ''}
        </div></div>
      <div class="dash mt-4">${cardOrder().map((k) => C[k])}</div>`;
  }

  /** Dados dos gráficos do painel (8 semanas, contexto do concurso). */
  function dashData(cid) {
    const today = D.today(), wk0 = D.weekStart(today, +P.settings.get('geral.inicio_semana', 0));
    const weeks = Array.from({ length: 8 }, (_, i) => D.add(wk0, -7 * (7 - i)));
    const wi = (d) => { const s = String(d).slice(0, 10); for (let i = weeks.length - 1; i >= 0; i--) if (s >= weeks[i]) return s <= D.add(weeks[i], 6) ? i : -1; return -1; };
    const qOk = (qid) => { if (!cid) return true; const q = S.getAny('est_questoes', qid); return !q || !q.concurso_id || q.concurso_id === cid; };
    const certas = weeks.map(() => 0), erradas = weeks.map(() => 0), horas = weeks.map(() => 0);
    S.all('est_tentativas').forEach((t) => { const i = wi(t.created_at); if (i < 0 || !qOk(t.questao_id)) return; const r = E.res(t); if (r === 'certa') certas[i]++; else if (r === 'errada') erradas[i]++; });
    S.where('est_sessoes', (x) => x.status === 'encerrada' && inCtx(x)).forEach((x) => { const i = wi(x.inicio); if (i >= 0) horas[i] += (+x.liquido_s || 0) / 3600; });
    const lm = P.estQ ? P.estQ.lastMap() : {}, qs = S.all('est_questoes').filter((q) => !cid || q.concurso_id === cid);
    const acc = P.estQ ? P.estQ.accuracy(qs, lm) : { certas: 0, erradas: 0, ineditas: 0, pct: null };
    const byD = {};
    qs.forEach((q) => { const x = lm[q.id]; if (!x) return; const r = E.res(x.t); if (r !== 'certa' && r !== 'errada') return; const k = q.disciplina_id || '_'; const o = byD[k] || (byD[k] = { c: 0, n: 0 }); o.n++; if (r === 'certa') o.c++; });
    const disc = Object.entries(byD).map(([k, o]) => ({ nome: k === '_' ? 'Sem disciplina' : E.discNome(k) || '—', pct: (o.c / o.n) * 100, n: o.n })).sort((a, b) => b.pct - a.pct).slice(0, 12);
    const meta = +P.settings.get('est.meta_horas_semana', 0) || null;
    return { labels: weeks.map((w) => w.slice(8, 10) + '/' + w.slice(5, 7)), certas, erradas, horas: horas.map((x) => Math.round(x * 10) / 10), acc, disc, meta };
  }
  function painelCharts(root) {
    const d = st.dash; if (!d || !P.charts) return;
    const cv = (n, f) => (getComputedStyle(document.documentElement).getPropertyValue(n) || '').trim() || f;
    const ok = cv('--success', '#5F9E8F'), bad = cv('--danger', '#E06C75');
    const q = (k) => root.querySelector(`[data-ch="${k}"]`);
    if (q('assert')) P.charts.mount(q('assert'), { type: 'doughnut', labels: ['Certas', 'Erradas'], series: [{ data: [d.acc.certas, d.acc.erradas], colors: [ok, bad] }], noScales: true, height: 170, empty: 'Nenhuma questão respondida' });
    if (q('qsem')) P.charts.mount(q('qsem'), { type: 'bar', labels: d.labels, series: [{ label: 'Certas', data: d.certas, color: ok }, { label: 'Erradas', data: d.erradas, color: bad }], legend: true, height: 240, empty: 'Nenhuma resposta nas últimas 8 semanas' });
    if (q('horas')) P.charts.mount(q('horas'), { type: 'bar', labels: d.labels, series: [{ label: 'Horas', data: d.horas }], goal: d.meta || undefined, height: 220, fmt: (v) => fmt.num(v, 1) + ' h', empty: 'Nenhuma sessão nas últimas 8 semanas' });
    if (q('disc')) P.charts.mount(q('disc'), { type: 'bar', horizontal: true, labels: d.disc.map((x) => x.nome + ' (' + x.n + ')'), series: [{ label: 'Precisão', data: d.disc.map((x) => Math.round(x.pct * 10) / 10) }], height: Math.max(160, 34 * d.disc.length + 40), fmt: (v) => fmt.num(v, 1) + '%', yfmt: (v) => v + '%', empty: 'Responda questões com disciplina para ver a precisão' });
  }

  P.screen('est', { mod: 'est', tab: 'painel', title: 'Estudos', deps: T_EST, render: painel, mount(root) {
    try { painelCharts(root); } catch (e) { P.reportError(e, 'gráficos do painel'); }
    const el = root.querySelector('[data-live-session]');
    if (el) { const t = setInterval(() => { if (!document.body.contains(el)) return clearInterval(t); el.textContent = fmt.dur(E.liveSecs(E.open())); }, 15000); }
  } });

  // indicadores do painel → registros de origem
  function drill(k) {
    const today = D.today(), wk0 = D.weekStart(today, +P.settings.get('geral.inicio_semana', 0));
    if (k === 'horas') {
      const rows = S.where('est_sessoes', (s) => s.status === 'encerrada' && String(s.inicio).slice(0, 10) >= wk0 && inCtx(s)).sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
      ui.sheet({ title: 'Sessões da semana', body: rows.length ? h`<div class="list">${rows.map((s) => sessionRow(s))}</div><p class="faint mt-3" style="font-size:12px">Tempo líquido: pausas descontadas, calculado pelo servidor.</p>` : ui.empty({ ill: 'list', title: 'Nenhuma sessão nesta semana', small: true }) });
    } else if (k === 'questoes') {
      const rows = S.where('est_tentativas', (t) => String(t.created_at).slice(0, 10) >= D.add(today, -6)).sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
      ui.sheet({ title: 'Tentativas dos últimos 7 dias', body: rows.length ? h`<div class="list">${rows.slice(0, 200).map((t) => { const q = S.getAny('est_questoes', t.questao_id) || {}; const r = E.res(t); return h`<div class="li"><span class="chip ${r === 'certa' ? 'up' : r === 'errada' ? 'down' : ''}">${r.replace('_', ' ')}</span><span class="main"><span class="t">${q.codigo || '?'} · ${String(q.enunciado || '').slice(0, 80)}</span><span class="s">${fmt.date(String(t.created_at).slice(0, 10))} · ${t.modo}${t.primeira ? ' · 1ª tentativa' : ''}${t.resultado !== t.resultado_atual && t.resultado_atual ? ' · original: ' + t.resultado : ''}</span></span></div>`; })}</div><p class="faint mt-3" style="font-size:12px">Precisão = certas ÷ (certas + erradas). Brancos, anuladas e sem gabarito ficam fora.</p>` : ui.empty({ ill: 'list', title: 'Nenhuma tentativa', small: true }) });
    }
  }
  const sessionRow = (s) => h`<div class="li tap" data-act="est.sessEdit" data-id="${s.id}"><span class="tile sm" style="--tc:${E.discCor(s.disciplina_id)}">${icon('timer', 'sm')}</span><span class="main"><span class="t">${TIPO_SES[s.tipo] || s.tipo}${s.disciplina_id ? ' · ' + E.discNome(s.disciplina_id) : ''}${s.assunto_id ? ' — ' + E.assNome(s.assunto_id) : ''}</span><span class="s">${fmt.date(String(s.inicio).slice(0, 10))} ${fmt.time(s.inicio)}${s.fim ? '–' + fmt.time(s.fim) : ''} · ${s.origem}${s.status === 'cancelada' ? ' · cancelada' : ''}${s.edicao_motivo ? ' · corrigida' : ''}</span></span><span class="v num">${fmt.dur(s.liquido_s)}</span></div>`;
  E.sessionRow = sessionRow;

  function painelCfg() {
    const pref = P.settings.get('est.painel', null) || {}, ord = cardOrder().concat(CARDS.map((c) => c[0]).filter((k) => (pref.ocultos || []).includes(k)));
    const s = ui.sheet({ title: 'Personalizar painel', body: h`<p class="muted" style="font-size:13px">Escolha os cartões e a ordem.</p><div class="list mt-2" data-cards>${ord.map((k, i) => h`<div class="li" data-k="${k}"><label class="toggle"><input type="checkbox" ${(pref.ocultos || []).includes(k) ? '' : raw('checked')}><span></span></label><span class="main"><span class="t">${CARDS.find((c) => c[0] === k)[1]}</span></span><button type="button" class="btn-icon sm" data-up aria-label="Subir">${icon('chev-u', 'sm')}</button><button type="button" class="btn-icon sm" data-down aria-label="Descer">${icon('chev-d', 'sm')}</button></div>`)}</div>`,
      foot: h`<button class="btn btn-primary" data-save>Salvar</button>`,
      onMount(sh) {
        const box = sh.$('[data-cards]');
        box.addEventListener('click', (e) => { const li = e.target.closest('.li'); if (!li) return; if (e.target.closest('[data-up]') && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling); if (e.target.closest('[data-down]') && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li); });
        sh.$('[data-save]').onclick = async () => {
          const items = Array.from(box.querySelectorAll('.li'));
          await P.settings.set({ 'est.painel': { ordem: items.map((x) => x.dataset.k), ocultos: items.filter((x) => !x.querySelector('input').checked).map((x) => x.dataset.k) } }).catch(() => {});
          sh.close(); P.router.render(true);
        };
      } });
    return s;
  }

  // ================= Concursos e etapas =================
  function concursosScreen() {
    const g = E.gate(); if (g) return g;
    const fk = 'est.conc', sit = P.flt.get(fk, 'sit', 'ativos');
    const all = S.all('est_concursos').sort((a, b) => (b.principal ? 1 : 0) - (a.principal ? 1 : 0) || (a.prioridade || 2) - (b.prioridade || 2));
    const rows = all.filter((c) => (sit === 'ativos' ? !c.arquivado : sit === 'arquivados' ? c.arquivado : c.situacao === sit) && P.flt.match(fk, c.nome, c.orgao, c.cargo, c.banca, c.localidade));
    return h`<div class="page-head"><div><h1>Concursos</h1><p>${all.filter((c) => !c.arquivado).length} ativo(s)</p></div><button class="btn btn-primary btn-sm" data-act="est.concNew">${icon('plus', 'sm')}Novo concurso</button></div>

      ${rows.length ? h`<div class="grid acc-grid">${rows.map((c) => { const cov = E.coverage(c.id), n = countdown(c.data_prova); return h`<a class="card link pad-lg" href="#/est/concurso/${c.id}"><div class="row between"><b>${c.principal ? h`${icon('star', 'xs')} ` : ''}${c.nome}</b><span class="chip ${SIT[c.situacao][1]}">${SIT[c.situacao][0]}</span></div>
        <p class="muted mt-2" style="font-size:13px">${[c.orgao, c.cargo, c.banca].filter(Boolean).join(' · ') || '—'}</p>
        <p class="mt-2" style="font-size:13px">${concLabel(c)}</p>${cov.ed ? h`<div class="mt-3">${ui.progress(cov.pct || 0)}<p class="faint mt-2" style="font-size:12px">Edital v${cov.ed.versao}: ${cov.concluidos}/${cov.total} assuntos concluídos</p></div>` : h`<p class="faint mt-3" style="font-size:12px">Sem edital verticalizado</p>`}
        ${n != null && n >= 0 && n <= 60 ? h`<span class="chip down mt-2">${n} dias</span>` : ''}</a>`; })}</div>`
        : ui.empty({ ill: 'target', title: all.length ? 'Nada neste filtro' : 'Nenhum concurso', text: 'Cadastre os concursos que você acompanha. Datas guardam fonte e se são confirmadas ou estimadas.', action: { act: 'est.concNew', label: 'Novo concurso' } })}`;

  /** Etapa com data → evento na Agenda (lembrete pelo módulo de notificações). */
  async function syncEvent(et) {
    if (!et.data || et.status !== 'pendente') { if (et.evento_id && S.get('tar_eventos', et.evento_id)) S.remove('tar_eventos', et.evento_id, { undo: false }); return; }
    const c = E.conc(et.concurso_id), titulo = `${et.titulo}${c && !String(et.titulo).includes(c.nome) ? ' · ' + c.nome : ''}${et.data_status !== 'confirmada' ? ' (' + DSTAT[et.data_status] + ')' : ''}`;
    const ini = et.hora ? `${et.data}T${et.hora}:00` : `${et.data}T00:00:00`;
    const off = -new Date(ini).getTimezoneOffset(), tz = `${off >= 0 ? '+' : '-'}${String(Math.floor(Math.abs(off) / 60)).padStart(2, '0')}:${String(Math.abs(off) % 60).padStart(2, '0')}`;
    const ev = { titulo, inicio: ini + tz, dia_inteiro: !et.hora, local: et.local || null, lembrete_min: et.lembrete_min != null && et.lembrete_min !== '' ? +et.lembrete_min : null, descricao: 'Etapa de concurso (Estudos)' + (et.fonte ? ' · fonte: ' + et.fonte : ''), cor: '#B98900' };
    if (et.evento_id && S.get('tar_eventos', et.evento_id)) ev.id = et.evento_id;
    const saved = await S.save('tar_eventos', ev).catch(() => null);
    if (saved && saved.id !== et.evento_id) S.save('est_etapas', { id: et.id, evento_id: saved.id }).catch(() => {});
  }

  // ================= Edital verticalizado =================
  function editalScreen(ctx) {
    const g = E.gate(); if (g) return g;
    let ed = ctx.q.ed ? S.get('est_editais', ctx.q.ed) : null;
    const cid = ed ? ed.concurso_id : E.ctx();
    if (!ed && cid) ed = E.editalAtivo(cid);
    const conc = cid ? E.conc(cid) : null;
    if (!conc) return h`<div class="page-head"><div><h1>Edital verticalizado</h1></div></div>${concChips()}${ui.empty({ ill: 'layers', title: 'Escolha um concurso', text: 'O edital pertence a um concurso.', action: { act: 'ui.go', data: { to: 'est/concursos' }, label: 'Concursos' } })}`;
    if (!ed) return h`<div class="page-head"><div><h1>Edital verticalizado</h1><p>${conc.nome}</p></div></div>${concChips()}${ui.empty({ ill: 'layers', title: 'Sem edital cadastrado', text: 'Cole o conteúdo programático, importe uma planilha ou cadastre manualmente.', action: { act: 'est.editalNew', data: { id: conc.id }, label: 'Cadastrar edital' } })}`;
    const versoes = S.where('est_editais', (e) => e.concurso_id === conc.id).sort((a, b) => b.versao - a.versao);
    const its = E.itensDo(ed.id), f = st.edFiltro, q = P.norm(st.edQ);
    const tent = {}; S.all('est_tentativas').forEach((t) => { const qq = S.getAny('est_questoes', t.questao_id); if (qq && qq.assunto_id) (tent[qq.assunto_id] = tent[qq.assunto_id] || []).push(t); });
    const rows = its.map((x) => ({ x, a: E.ass(x.assunto_id) })).filter((r) => r.a).filter((r) => {
      const m = f === 'baixo' ? E.mastery(r.a.id) : null;
      return (f === 'todos' ? r.x.alteracao !== 'retirado' : f === 'nao' ? r.a.teoria === 'nao_iniciada' && r.x.alteracao !== 'retirado' : f === 'pend' ? r.a.teoria !== 'concluida' && r.x.alteracao !== 'retirado' : f === 'baixo' ? m.nivel === 'baixo' : f === 'mudou' ? r.x.alteracao !== 'mantido' : true)
        && (!q || P.norm(r.a.titulo + ' ' + E.discNome(r.a.disciplina_id) + ' ' + (r.x.item_ref || '')).includes(q));
    });
    const byDisc = P.groupBy(rows, (r) => r.x.disciplina_id || r.a.disciplina_id);
    const cov = E.coverage(conc.id);
    const ALT = { adicionado: ['adicionado', 'up'], alterado: ['alterado', 'info'], retirado: ['retirado', 'down'] };
    return h`<div class="page-head"><div>${back('est/concurso/' + conc.id, conc.nome)}<h1 class="mt-2">Edital verticalizado</h1><p>${ed.titulo || 'Edital'} · versão ${ed.versao}${ed.ativo ? ' (em uso)' : ' (antiga)'}${ed.fonte ? ' · ' + ed.fonte : ''}</p></div>
        <div class="row-sm wrap"><button class="btn btn-ghost btn-sm" data-act="est.editalNew" data-id="${conc.id}">${icon('plus', 'sm')}Nova versão</button><button class="btn btn-ghost btn-sm" data-act="est.import" data-tabela="assuntos" data-conc="${conc.id}">${icon('upload', 'sm')}Importar planilha</button></div></div>
      ${versoes.length > 1 ? h`<div class="chips mb-2">${versoes.map((v) => h`<a class="fchip ${v.id === ed.id ? 'on' : ''}" href="#/est/edital?ed=${v.id}">v${v.versao}${v.ativo ? ' · em uso' : ''}</a>`)}</div>` : ''}
      <div class="grid g3 mb-3"><div class="card">${ui.metric({ label: 'Cobertura (teoria concluída)', value: cov.pct == null ? '—' : fmt.num(cov.pct, 1) + '%', size: 'md', sub: `${cov.concluidos || 0} de ${cov.total} assuntos` })}</div><div class="card">${ui.metric({ label: 'Cobertura ponderada', value: cov.pond == null ? '—' : fmt.num(cov.pond, 1) + '%', size: 'md', sub: 'pelo peso ou nº de questões' })}</div>
        <div class="card">${ui.metric({ label: 'Itens', value: its.filter((x) => x.alteracao !== 'retirado').length, size: 'md', sub: its.some((x) => x.alteracao !== 'mantido') ? `${its.filter((x) => x.alteracao === 'adicionado').length} novos · ${its.filter((x) => x.alteracao === 'alterado').length} alterados · ${its.filter((x) => x.alteracao === 'retirado').length} retirados` : 'versão inicial' })}</div></div>
      <div class="filters mb-3"><div class="row-sm"><div class="search grow">${icon('search')}<input class="input" id="ed-q" placeholder="Buscar assunto ou item" value="${st.edQ}" data-on-input="est.edQ"></div></div>
        ${ui.chips([['todos', 'Todos'], ['nao', 'Não iniciados'], ['pend', 'Pendentes'], ['baixo', 'Baixo desempenho'], ['mudou', 'Mudou na retificação']], f, 'est.edFiltro')}</div>
      <p class="faint mb-3" style="font-size:12px">Teoria, prática, revisão e domínio são acompanhados separadamente. Domínio = precisão nas últimas 20 respostas do assunto (mínimo 10). Toque na situação da teoria para mudar.</p>
      ${Object.keys(byDisc).length ? Object.keys(byDisc).map((did) => { const lst = byDisc[did]; return h`<div class="section-title"><h2>${E.discNome(did)}</h2><span class="faint" style="font-size:12.5px">${lst.filter((r) => r.a.teoria === 'concluida').length}/${lst.length}</span></div>

          ${ciclo.length ? h`<div class="list">${ciclo.map((c, i) => h`<div class="li ${i === (+plano.ciclo_pos || 0) % ciclo.length ? 'on' : ''}"><span class="faint num" style="width:18px">${i + 1}</span><span class="main"><span class="t">${E.discNome(c.disciplina_id)}${c.assunto_id ? ' — ' + E.assNome(c.assunto_id) : ''}</span><span class="s">${TIPO_SES[c.tipo]} · ${c.minutos} min${c.fixo ? ' · fixo' : ''}</span></span>${i === (+plano.ciclo_pos || 0) % ciclo.length ? h`<span class="chip up">próximo</span>` : ''}</div>`)}</div><p class="faint mt-2" style="font-size:12px">O ciclo retoma de onde você parou: ao encerrar uma sessão da disciplina "próxima", ele avança.</p>`
            : h`<p class="muted" style="font-size:13px">Sem ciclo: a sugestão usa as disciplinas do edital. Use "Aplicar ao ciclo" na distribuição.</p>`}</div>
      </div><div class="span-7 stack">
        <div class="card pad-lg"><div class="card-head">${icon('zap')}<h3>Distribuição sugerida</h3><button class="btn btn-primary btn-sm" data-act="est.planSuggest" data-id="${plano.id}">${icon('refresh', 'sm')}${sug ? 'Recalcular' : 'Calcular'}</button></div>
          ${sug ? h`${sug.avisos.map((a) => h`<p class="chip down mt-2" style="white-space:normal;height:auto;padding:6px 10px">${a}</p>`)}
            <div class="ed-table mt-2"><table class="table"><thead><tr><th>Disciplina</th><th class="r">Peso edital</th><th class="r">Dific.</th><th class="r">Desemp.</th><th class="r">Pend.</th><th class="r">Ajuste</th><th class="r">Min/sem</th></tr></thead><tbody>
              ${sug.distribuicao.map((d) => h`<tr><td>${d.nome}<div class="faint" style="font-size:11.5px">${d.pendentes}/${d.assuntos} pendentes · ${d.precisao == null ? 'precisão sem dados' : d.precisao + '% em ' + d.amostra}</div></td><td class="r num">${fmt.num(d.peso_edital, 1)}</td><td class="r num">×${fmt.num(d.f_dificuldade, 2)}</td><td class="r num">×${fmt.num(d.f_desempenho, 2)}</td><td class="r num">×${fmt.num(d.f_pendencia, 2)}</td><td class="r"><input class="input sm num" style="width:64px" data-on-change="est.planAjuste" data-plano="${plano.id}" data-disc="${d.disciplina_id}" value="${fmt.num(d.ajuste, 2)}" aria-label="Ajuste ${d.nome}"></td><td class="r num"><b>${d.minutos_semana}</b></td></tr>`)}</tbody></table></div>
            <p class="faint mt-2" style="font-size:12px">Como é calculado: ${sug.criterio}. Capacidade útil: ${fmt.dur(sug.capacidade_util_min * 60)}/semana.${sug.dias_para_prova != null ? ` Faltam ${sug.dias_para_prova} dias para a prova; teoria pendente estimada em ${fmt.dur(sug.esforco_pendente_min * 60)}.` : ''}</p>
            <div class="row-sm mt-2"><button class="btn btn-ghost btn-sm" data-act="est.planToCiclo" data-id="${plano.id}">${icon('repeat', 'sm')}Aplicar ao ciclo</button></div>` : h`<p class="muted" style="font-size:13px">Calcula quanto tempo dar a cada disciplina pelo peso no edital, dificuldade, seu desempenho recente e o que falta estudar. Nada muda até você confirmar.</p>`}</div>
        ${sug ? h`<div class="card pad-lg"><div class="card-head">${icon('calendar')}<h3>Prévia dos próximos 7 dias</h3><button class="btn btn-primary btn-sm" data-act="est.planApply" data-id="${plano.id}">${icon('check', 'sm')}Criar tarefas selecionadas</button></div>
          ${sug.conflitos.length ? h`<p class="faint" style="font-size:12.5px">Conflitos: ${sug.conflitos.join(' · ')}</p>` : ''}
          ${sug.cronograma.length ? h`<div class="list" data-prev>${sug.cronograma.map((x, i) => h`<label class="li"><input type="checkbox" data-pi="${i}" ${raw(S.where('tar_tarefas', (t) => t.est_chave === x.chave).length ? 'disabled' : 'checked')}><span class="main"><span class="t">${fmt.day(x.data)} · ${TIPO_SES[x.tipo]} · ${E.discNome(x.disciplina_id)}${x.assunto_id ? ' — ' + E.assNome(x.assunto_id) : ''}</span><span class="s">${x.minutos} min${S.where('tar_tarefas', (t) => t.est_chave === x.chave).length ? ' · já criada' : ''}</span></span></label>`)}</div>
            <p class="faint mt-2" style="font-size:12px">Prazos oficiais, tarefas fixas e registros passados não são alterados. Desmarque o que não quiser.</p>` : h`<p class="muted" style="font-size:13px">Sem espaço livre na disponibilidade dos próximos dias.</p>`}</div>` : ''}
      </div></div>
      <div class="section-title"><h2>Atividades de estudo</h2><div class="row-sm">${ui.seg([['lista', 'Lista'], ['quadro', 'Quadro']], ver, 'est.ativVer', { cls: 'sm' })}<button class="btn btn-ghost btn-sm" data-act="est.ativNew">${icon('plus', 'sm')}Atividade</button></div></div>
      <div class="filters mb-3"><div class="row-f">${P.flt.chips(fk, 'sit', [['abertas', 'Abertas'], ['feitas', 'Concluídas'], ['todas', 'Todas']], 'abertas')}${P.flt.select(fk, 'disc', E.disciplinas().map((d) => [d.id, d.nome]), 'Todas as disciplinas')}</div>${tasks.length > 6 ? P.flt.search(fk, 'Buscar atividade') : ''}</div>
      ${sel.size ? h`<div class="card selbar mb-3"><b>${sel.size} selecionada(s)</b><div class="row-sm wrap"><button class="btn btn-sm btn-ghost" data-act="est.lote" data-v="feito">${icon('check', 'sm')}Concluir</button><button class="btn btn-sm btn-ghost" data-act="est.lote" data-v="amanha">${icon('calendar', 'sm')}Para amanhã</button><button class="btn btn-sm btn-ghost" data-act="est.lote" data-v="data">${icon('calendar', 'sm')}Escolher data</button><button class="btn btn-sm btn-ghost" data-act="est.lote" data-v="limpar">Limpar</button></div></div>` : ''}
      ${tasks.length ? (ver === 'quadro' ? h`<div class="kanban">${[['a_fazer', 'A fazer'], ['fazendo', 'Fazendo'], ['feito', 'Feito']].map(([k, l]) => h`<div class="kcol"><h3><span>${l}</span><span class="faint">${tasks.filter((t) => t.status === k).length}</span></h3>${tasks.filter((t) => t.status === k).map((t) => h`<div class="kcard tap" data-act="est.ativEdit" data-id="${t.id}"><b>${t.titulo}</b><div class="faint" style="font-size:12px">${t.data_vencimento ? fmt.dm(t.data_vencimento) : 'sem data'}${t.duracao_estimada_min ? ' · ' + t.duracao_estimada_min + ' min' : ''}</div></div>`)}</div>`)}</div>`
        : h`<div class="list cardlist">${tasks.slice(0, 200).map((t) => { const cl = t.est_checklist_json || []; return h`<div class="li ${t.status === 'feito' ? 'done' : ''}"><input type="checkbox" data-on-change="est.selTask" data-id="${t.id}" ${raw(sel.has(t.id) ? 'checked' : '')} aria-label="Selecionar"><button class="check ${t.status === 'feito' ? 'on' : ''}" data-act="tar.toggle" data-id="${t.id}" aria-label="Concluir">${icon('check')}</button><span class="main tap" data-act="est.ativEdit" data-id="${t.id}"><span class="t">${t.titulo}</span><span class="s">${t.data_vencimento ? fmt.day(t.data_vencimento) : 'sem data'}${t.duracao_estimada_min ? ' · ' + t.duracao_estimada_min + ' min' : ''}${cl.length ? ` · ${cl.filter((x) => x.ok).length}/${cl.length}` : ''}${t.est_criterio ? ' · ' + t.est_criterio : ''}</span></span><button class="btn-icon sm" data-act="est.startTask" data-id="${t.id}" aria-label="Estudar">${icon('play', 'sm')}</button></div>`; })}</div>`)
        : ui.empty({ ill: 'check', title: 'Nenhuma atividade', text: 'Crie pela prévia do plano ou manualmente (com disciplina, assunto, material, checklist e critério de conclusão).', small: true })}`;
  }

  function planEdit(row) {
    const isNew = !row, d = (row && row.disponibilidade_json) || { 0: 0, 1: 120, 2: 120, 3: 120, 4: 120, 5: 120, 6: 180 };
    const v = { ...(row || { nome: 'Meu plano', modo: 'ciclo', fase: 'pre_edital', sessao_min: 50, pausa_min: 10, folga_pct: 15, inicio: D.today(), concurso_id: E.ctx() || null, ativo: true }) };
    [0, 1, 2, 3, 4, 5, 6].forEach((i) => { v['_d' + i] = d[i] || 0; });
    ui.editSheet({ table: 'est_planos', row: isNew ? null : v, title: isNew ? 'Novo plano' : 'Editar plano', size: 'full', defaults: v,
      fields: [{ k: 'nome', l: 'Nome', t: 'text', req: true }, { k: 'concurso_id', l: 'Concurso', t: 'select', ph: 'Geral', opts: () => E.concursos().map((c) => [c.id, c.nome]) },
        { k: 'modo', l: 'Formato', t: 'seg', opts: [['ciclo', 'Ciclo sequencial'], ['cronograma', 'Cronograma por dia']] }, { k: 'fase', l: 'Fase', t: 'seg', opts: [['pre_edital', 'Pré-edital'], ['pos_edital', 'Pós-edital']] }]
        .concat([0, 1, 2, 3, 4, 5, 6].map((i) => ({ k: '_d' + i, l: `${fmt.WDL[i]} (min)`, t: 'int', half: true, min: 0, max: 960 })))
        .concat([{ k: 'sessao_min', l: 'Duração da sessão', t: 'int', unit: 'min', half: true, min: 15, max: 240 }, { k: 'pausa_min', l: 'Pausa entre sessões', t: 'int', unit: 'min', half: true, min: 0, max: 60 }, { k: 'folga_pct', l: 'Margem para imprevistos', t: 'int', unit: '%', half: true, min: 0, max: 60 }, { k: 'inicio', l: 'Início', t: 'date', half: true }, { k: 'fim', l: 'Fim', t: 'date', half: true }, { k: 'ativo', l: 'Plano ativo', t: 'toggle' }]),
      save: async (r, sh) => {
        const out = { ...r }; const disp = {};
        [0, 1, 2, 3, 4, 5, 6].forEach((i) => { const inp = sh.$(`[data-k="_d${i}"]`); disp[i] = Math.max(0, Math.round(P.parseNum(inp ? inp.value : 0) || 0)); });
        out.disponibilidade_json = disp; ['sessao_min', 'pausa_min', 'folga_pct'].forEach((k) => { out[k] = +out[k] || 0; });
        const saved = await S.save('est_planos', out, { silentError: true }); st.planId = saved.id; st.sug = null; return saved;
      } });
  }

  function cicloEdit(planoId) {
    const plano = S.get('est_planos', planoId);
    let itens = S.where('est_ciclo_itens', (c) => c.plano_id === planoId).sort((a, b) => a.ordem - b.ordem).map((c) => ({ ...c }));
    const discs = E.disciplinas();
    const draw = () => h`<div class="list" data-list>${itens.map((c, i) => h`<div class="li" data-i="${i}"><select class="input sm" data-k="disciplina_id" aria-label="Disciplina">${discs.map((d) => h`<option value="${d.id}" ${d.id === c.disciplina_id ? raw('selected') : ''}>${d.nome}</option>`)}</select><select class="input sm" data-k="tipo" aria-label="Tipo">${Object.entries(TIPO_SES).slice(0, 5).map(([k, l]) => h`<option value="${k}" ${k === c.tipo ? raw('selected') : ''}>${l}</option>`)}</select><input class="input sm num" style="width:70px" data-k="minutos" value="${c.minutos}" aria-label="Minutos"><button type="button" class="btn-icon sm" data-up aria-label="Subir">${icon('chev-u', 'sm')}</button><button type="button" class="btn-icon sm" data-del aria-label="Remover">${icon('trash', 'sm')}</button></div>`)}</div><button type="button" class="btn btn-ghost btn-sm mt-2" data-add>${icon('plus', 'sm')}Disciplina</button>`;
    ui.sheet({ title: 'Ciclo · ' + plano.nome, size: 'full', body: h`<div data-box>${draw()}</div>`, foot: h`<button class="btn btn-primary" data-save>Salvar ciclo</button>`,
      onMount(sh) {
        const box = sh.$('[data-box]'), redraw = () => { box.innerHTML = P.toHtml(draw()); };
        box.addEventListener('change', (e) => { const li = e.target.closest('[data-i]'); if (li) itens[+li.dataset.i][e.target.dataset.k] = e.target.dataset.k === 'minutos' ? +e.target.value || 30 : e.target.value; });
        box.addEventListener('click', (e) => { const li = e.target.closest('[data-i]'); if (e.target.closest('[data-add]')) { if (!discs.length) { ui.toast('Cadastre o edital ou disciplinas antes.', { error: true }); return; } itens.push({ disciplina_id: discs[0].id, tipo: 'teoria', minutos: plano.sessao_min || 50 }); redraw(); } if (!li) return; const i = +li.dataset.i; if (e.target.closest('[data-del]')) { itens.splice(i, 1); redraw(); } if (e.target.closest('[data-up]') && i > 0) { [itens[i - 1], itens[i]] = [itens[i], itens[i - 1]]; redraw(); } });
        sh.$('[data-save]').onclick = async () => {
          const old = S.where('est_ciclo_itens', (c) => c.plano_id === planoId), keep = new Set(itens.filter((c) => c.id).map((c) => c.id));
          old.filter((c) => !keep.has(c.id)).forEach((c) => S.remove('est_ciclo_itens', c.id, { undo: false }));
          await S.saveMany('est_ciclo_itens', itens.map((c, i) => ({ id: c.id, plano_id: planoId, disciplina_id: c.disciplina_id, tipo: c.tipo, minutos: +c.minutos || 30, ordem: i }))).catch(() => {});
          sh.close(); ui.toast('Ciclo salvo'); P.router.render(true);
        };
      } });
  }

  function ativEdit(row, defaults = {}) {
    const isNew = !row;
    const v = row ? { ...row, _check: (row.est_checklist_json || []).map((x) => (x.ok ? '[x] ' : '') + x.t).join('\n') } : { status: 'a_fazer', prioridade: 2, est_tipo: 'teoria', est_concurso_id: E.ctx() || null, ...defaults };
    ui.editSheet({ table: 'tar_tarefas', row: isNew ? null : v, title: isNew ? 'Nova atividade de estudo' : 'Editar atividade', size: 'full', defaults: v,
      fields: [{ k: 'titulo', l: 'Título', t: 'text', req: true, focus: isNew }, { k: 'descricao', l: 'Descrição', t: 'textarea', rows: 2 },
        { k: 'est_tipo', l: 'Tipo', t: 'select', half: true, opts: [['teoria', 'Teoria'], ['questoes', 'Questões'], ['revisao', 'Revisão'], ['simulado', 'Simulado'], ['discursiva', 'Discursiva'], ['leitura', 'Leitura'], ['aula', 'Aula'], ['projeto', 'Projeto de preparação']] },
        { k: 'est_concurso_id', l: 'Concurso', t: 'select', half: true, ph: 'Geral', opts: () => E.concursos().map((c) => [c.id, c.nome]) },
        { k: 'est_disciplina_id', l: 'Disciplina', t: 'select', half: true, ph: 'Nenhuma', opts: () => E.disciplinas().map((d) => [d.id, d.nome]) },
        { k: 'est_assunto_id', l: 'Assunto', t: 'select', half: true, ph: 'Nenhum', opts: (x) => (x.est_disciplina_id ? E.assuntosDe(x.est_disciplina_id) : S.all('est_assuntos')).map((a) => [a.id, a.titulo]) },
        { k: 'est_material_id', l: 'Material', t: 'select', ph: 'Nenhum', opts: () => S.all('est_materiais').filter((m) => m.situacao !== 'arquivado').map((m) => [m.id, m.codigo + ' · ' + m.titulo]) },
        { k: 'data_vencimento', l: 'Data', t: 'date', half: true }, { k: 'hora', l: 'Hora', t: 'time', half: true }, { k: 'duracao_estimada_min', l: 'Duração estimada', t: 'int', unit: 'min', half: true },
        { k: 'prioridade', l: 'Prioridade', t: 'seg', opts: [[1, 'Urgente'], [2, 'Alta'], [3, 'Média'], [4, 'Baixa']] }, { k: 'status', l: 'Situação', t: 'select', half: true, opts: [['a_fazer', 'A fazer'], ['fazendo', 'Fazendo'], ['feito', 'Feito'], ['cancelada', 'Cancelada']] },
        { k: '_check', l: 'Checklist (um item por linha; [x] = feito)', t: 'textarea', rows: 3 }, { k: 'est_criterio', l: 'Critério de conclusão', t: 'text', ph: 'Ex.: 30 questões com 70% de acerto' }],
      beforeSave: (r) => { const out = { ...r, prioridade: +r.prioridade || 2 }; if (out.status === 'feito' && (!row || row.status !== 'feito')) out.concluida_em = D.nowIso(); return out; },
      afterSave: (saved, extras) => { if (extras && extras._check !== undefined) S.save('tar_tarefas', { id: saved.id, est_checklist_json: String(extras._check || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => ({ t: l.replace(/^\[x\]\s*/i, ''), ok: /^\[x\]/i.test(l) })) }).catch(() => {}); },
      deleteLabel: 'Atividade excluída' });
  }
  E.ativEdit = ativEdit;

  // ================= Rotas =================
  P.screen('est/concursos', { mod: 'est', tab: 'concursos', title: 'Concursos', deps: T_EST, render: concursosScreen });
  P.screen('est/concurso/:id', { mod: 'est', tab: 'concursos', title: (c) => (E.conc(c.params && c.params.id) || {}).nome || 'Concurso', deps: T_EST.concat(['tar_eventos']), render: concursoDetail });
  P.screen('est/edital', { mod: 'est', tab: 'edital', title: 'Edital verticalizado', deps: T_EST, render: editalScreen, mount() { const i = document.getElementById('ed-q'); if (i && st._edFocus) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); st._edFocus = false; } } });
  P.screen('est/plano', { mod: 'est', tab: 'plano', title: 'Planejamento', deps: T_EST, render: planoScreen });

  Object.assign(P.act, {
    'est.ctx': (el) => { st.conc = el.dataset.v; P.router.render(true); },
    'est.drill': (el) => drill(el.dataset.k),
    'est.painelCfg': () => painelCfg(),
    'est.metaHoras': () => ui.sheet({ title: 'Meta semanal de horas', body: h`<div class="field"><label>Horas líquidas por semana</label><input class="input num" data-m inputmode="decimal" value="${P.settings.get('est.meta_horas_semana', '') || ''}" placeholder="Ex.: 20"><span class="hint">Aparece como linha tracejada no gráfico. 0 remove a meta.</span></div>`, foot: h`<button class="btn btn-primary grow" data-ok>Salvar</button>`,
      onMount(sh) { sh.$('[data-ok]').onclick = async () => { const v = P.parseNum(sh.$('[data-m]').value); if (!(v >= 0 && v <= 168)) { ui.toast('Use um valor entre 0 e 168.', { error: true }); return; } await P.settings.set({ 'est.meta_horas_semana': v || null }).catch(() => {}); sh.close(); P.router.render(true); }; } }),
    'est.concNew': () => concEdit(null),
    'est.concEdit': (el) => concEdit(E.conc(el.dataset.id)),
    'est.concMain': (el) => { S.where('est_concursos', (c) => c.principal).forEach((c) => S.save('est_concursos', { id: c.id, principal: false }).catch(() => {})); S.save('est_concursos', { id: el.dataset.id, principal: true }, { toast: 'Concurso principal definido' }).catch(() => {}); },
    'est.concArchive': async (el) => { const c = E.conc(el.dataset.id); await S.save('est_concursos', { id: c.id, arquivado: !c.arquivado, principal: c.arquivado ? c.principal : false }, { toast: c.arquivado ? 'Desarquivado' : 'Arquivado (o histórico fica guardado)' }).catch(() => {}); },
    'est.concResult': (el) => { const c = E.conc(el.dataset.id); ui.editSheet({ table: 'est_concursos', row: c, title: 'Resultado', fields: [{ k: 'situacao', l: 'Situação', t: 'select', opts: Object.entries(SIT).map(([k, v]) => [k, v[0]]) }, { k: 'resultado', l: 'Resultado e aprendizados', t: 'textarea', rows: 6, ph: 'Nota, classificação, o que funcionou e o que mudar.' }] }); },
    'est.concAnexo': async (el) => { const files = await P.files.pick({ accept: 'application/pdf,image/*', multiple: true }); if (!files || !files.length) return; await E.uploadToLibrary(files, { concurso_ids: el.dataset.id, tags: 'edital', categoria: 'outros' }); },
    'est.etapaNew': (el) => etapaEdit(null, el.dataset.id),
    'est.etapaEdit': (el) => etapaEdit(S.get('est_etapas', el.dataset.id)),
    'est.editalNew': (el) => editalNew(el.dataset.id),
    'est.edFiltro': (el) => { st.edFiltro = el.dataset.v; P.router.render(true); },
    'est.edQ': P.debounce((el) => { st.edQ = el.value; st._edFocus = true; P.router.render(true); }, 220),
    'est.teoria': (el) => { const a = E.ass(el.dataset.id), nx = { nao_iniciada: 'em_andamento', em_andamento: 'concluida', concluida: 'nao_iniciada' }[a.teoria]; S.save('est_assuntos', { id: a.id, teoria: nx }).catch(() => {}); },
    'est.assunto': (el) => assuntoSheet(el.dataset.id),
    'est.assEdit': (el) => { ui.closeAll(); assEdit(E.ass(el.dataset.id)); },
    'est.planEdit': (el) => planEdit(el.dataset.id ? S.get('est_planos', el.dataset.id) : null),
    'est.planSel': (el) => { st.planId = el.value; st.sug = null; P.router.render(true); },
    'est.planSuggest': async (el) => { el.classList.add('loading'); try { st.sug = await P.api.call('est.planSuggest', { plano_id: el.dataset.id, dias: 7 }, { timeout: 90000 }); } catch (e) { ui.toast(e.message, { error: true }); } el.classList.remove('loading'); P.router.render(true); },
    'est.planAjuste': async (el) => { const p = S.get('est_planos', el.dataset.plano), v = P.parseNum(el.value); if (!(v >= 0 && v <= 5)) { ui.toast('Use um ajuste de 0 a 5 (1 = sem ajuste).', { error: true }); return; } await S.save('est_planos', { id: p.id, pesos_json: { ...(p.pesos_json || {}), [el.dataset.disc]: v } }).catch(() => {}); P.act['est.planSuggest']({ dataset: { id: p.id }, classList: { add() {}, remove() {} } }); },
    'est.planToCiclo': async (el) => {
      const sug = st.sug; if (!sug) return;
      const ok = await ui.confirm({ title: 'Substituir o ciclo?', text: 'O ciclo passa a seguir a distribuição sugerida (uma sessão por disciplina, proporcional aos minutos).', ok: 'Aplicar' }); if (!ok) return;
      const sess = +sug.plano.sessao_min || 50, itens = [];
      sug.distribuicao.filter((d) => d.minutos_semana > 0).forEach((d) => { const n = Math.max(1, Math.round(d.minutos_semana / sess)); for (let i = 0; i < n; i++) itens.push({ disciplina_id: d.disciplina_id, minutos: sess, tipo: 'teoria' }); });
      // intercala as disciplinas
      const by = P.groupBy(itens, (x) => x.disciplina_id), mix = []; let more = true; while (more) { more = false; Object.values(by).forEach((l) => { if (l.length) { mix.push(l.shift()); more = true; } }); }
      S.where('est_ciclo_itens', (c) => c.plano_id === el.dataset.id).forEach((c) => S.remove('est_ciclo_itens', c.id, { undo: false }));
      await S.saveMany('est_ciclo_itens', mix.map((x, i) => ({ ...x, plano_id: el.dataset.id, ordem: i }))).catch(() => {});
      await S.save('est_planos', { id: el.dataset.id, ciclo_pos: 0 }).catch(() => {});
      ui.toast(`Ciclo com ${mix.length} sessões`); P.router.render(true);
    },
    'est.planApply': async (el) => {
      const sug = st.sug; if (!sug) return;
      const chosen = Array.from(document.querySelectorAll('[data-prev] input[data-pi]:checked')).map((i) => sug.cronograma[+i.dataset.pi]);
      if (!chosen.length) { ui.toast('Nada selecionado.'); return; }
      el.classList.add('loading');
      try { const r = await P.api.call('est.planApply', { plano_id: el.dataset.id, itens: chosen }, { mutation: true }); (r.tarefas || []).forEach((t) => S.put('tar_tarefas', t)); ui.toast(`${r.criadas} tarefa(s) criada(s)${r.puladas ? ', ' + r.puladas + ' já existiam' : ''}`); }
      catch (e) { ui.toast(e.message, { error: true }); } el.classList.remove('loading'); P.router.render(true);
    },
    'est.cicloEdit': (el) => cicloEdit(el.dataset.id),
    'est.ativVer': (el) => { P.flt.set('est.ativ', 'ver', el.dataset.v); P.router.render(true); },
    'est.ativNew': () => ativEdit(null),
    'est.ativEdit': (el) => ativEdit(S.get('tar_tarefas', el.dataset.id)),
    'est.selTask': (el) => { st.sel = st.sel || new Set(); if (el.checked) st.sel.add(el.dataset.id); else st.sel.delete(el.dataset.id); P.router.render(true); },
    'est.lote': async (el) => {
      const ids = [...(st.sel || [])], v = el.dataset.v;
      if (v === 'limpar') { st.sel = null; P.router.render(true); return; }
      let data = null;
      if (v === 'amanha') data = D.add(D.today(), 1);
      if (v === 'data') { data = await new Promise((res) => { ui.sheet({ title: 'Reagendar para', body: h`<input class="input" type="date" data-d value="${D.add(D.today(), 1)}">`, foot: h`<button class="btn btn-primary" data-ok>Reagendar</button>`, onMount(sh) { sh.$('[data-ok]').onclick = () => { const x = sh.$('[data-d]').value; res(x); sh.close(); }; }, onClose: () => res(null) }); }); if (!data) return; }
      const rows = ids.map((id) => (v === 'feito' ? { id, status: 'feito', concluida_em: D.nowIso() } : { id, data_vencimento: data, lembrete_enviado: false }));
      await S.saveMany('tar_tarefas', rows).catch(() => {}); st.sel = null; ui.toast(`${rows.length} atividade(s) atualizada(s)`); P.router.render(true);
    }
  });

  P.module({
    id: 'est', name: 'Estudos', icon: 'book', home: 'est', plusLabel: 'Iniciar estudo', plus: () => P.act['est.start']({ dataset: {} }),
    blurb: () => { if (!E.loaded) return 'Concursos, questões e revisões'; const r = E.revHoje().length, a = E.open(); return a ? 'Sessão aberta' : `${r} revisão(ões) hoje`; },
    tabs: [{ id: 'painel', label: 'Painel', icon: 'home', route: 'est' }, { id: 'questoes', label: 'Questões', icon: 'list', route: 'est/questoes' }, { id: 'revisoes', label: 'Revisões', icon: 'refresh', route: 'est/revisoes' }, { id: 'mais', label: 'Mais', icon: 'grid', more: true }],
    more: [{ id: 'sala', label: 'Sala de estudo', icon: 'timer', route: 'est/sala' }, { id: 'concursos', label: 'Concursos e editais', icon: 'target', route: 'est/concursos' }, { id: 'edital', label: 'Edital verticalizado', icon: 'layers', route: 'est/edital' }, { id: 'plano', label: 'Planejamento', icon: 'calendar', route: 'est/plano' },
      { id: 'biblioteca', label: 'Biblioteca', icon: 'book', route: 'est/biblioteca' }, { id: 'simulados', label: 'Simulados', icon: 'flag', route: 'est/simulados' }, { id: 'flashcards', label: 'Flashcards', icon: 'layers', route: 'est/flashcards' }, { id: 'ia', label: 'Assistente de IA', icon: 'zap', route: 'est/ia' }, { id: 'erros', label: 'Caderno de erros', icon: 'alert', route: 'est/erros' },
      { id: 'resumos', label: 'Resumos e anotações', icon: 'edit', route: 'est/resumos' }, { id: 'discursivas', label: 'Discursivas', icon: 'file', route: 'est/discursivas' }, { id: 'desempenho', label: 'Desempenho', icon: 'chart', route: 'est/desempenho' }, { id: 'relatorios', label: 'Relatórios', icon: 'file', route: 'est/relatorios' }, { id: 'historico', label: 'Histórico', icon: 'history', route: 'est/historico' }, { id: 'prefs', label: 'Preferências', icon: 'sliders', route: 'est/prefs' }]
  });
})();
</script>
