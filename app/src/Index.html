      document.documentElement.setAttribute('data-theme', t);
    })();

  <script>
    (function () {
      'use strict';
      var P = window.Prumo;
      P.boot = async function () {
        P.theme.init();
        if (!P.auth.token()) { P.login.show(); P.pwa.hello(); return; }
        P.shell.init();
        try {
          var data = await P.api.call('boot', {}, { timeout: 150000, retries: 1 });
          P.me = data.profile || {};
          P.settings.map = data.settings || {};
          P.bootInfo = data;
          P.store.load(data.tables);
          if (data.profile && data.profile.tema && data.profile.tema !== P.theme.mode) P.theme.apply(data.profile.tema);
          P.store.on(function (tables) {
            P.router.refresh(tables);
            if (tables.some(function (t) { return /^(notificacoes|fin_lancamentos|tar_tarefas|fin_faturas)$/.test(t); })) P.shell.renderTop(P.router.current() || {});
          });
          var startRouter = function () { P.router.start(); P.pwa.hello(); if (P.me.tem_pin) P.ui.lock(); if (P.alarms) P.alarms.start(); };
          if (!location.hash && window.google && google.script && google.script.url) {
            google.script.url.getLocation(function (loc) { if (loc && loc.hash) location.hash = loc.hash; startRouter(); });
          } else startRouter();
        } catch (e) {
          if (e.code === 'AUTH') return;
          var hint = /aba|setup/i.test(e.message) ? 'Rode a função setup() no editor do Apps Script e recarregue.' : 'Verifique a conexão e tente de novo.';
          document.getElementById('view').innerHTML = P.toHtml(P.h`<div class="error-box" style="margin-top:40px">
            <h2>Não foi possível abrir o Prumo</h2><p class="muted mt-2">${e.message}</p><p class="muted mt-2">${hint}</p>
            <button class="btn btn-primary mt-4" data-act="ui.reload">Tentar novamente</button></div>`);
          P.reportError(e, 'boot');
        }
      };
      P.boot();
    })();
  </script>
