          ${sw('est.exportar_ao_sair', 'Disponibilizar a cópia anotada ao sair do leitor', 'Gera e guarda o PDF com as marcações para você pedir pelo Telegram com o app fechado', true)}
          <div class="li"><span class="main"><span class="t">Cores de marcação</span><span class="s">Separadas por vírgula (hex)</span></span><input class="input sm" style="width:200px" data-on-change="est.prefCores" value="${(fs('est.cores', null) || ['#F2B705', '#5F9E8F', '#E06C75', '#61AFEF', '#C678DD']).join(', ')}" aria-label="Cores"></div>

            <div class="li"><span class="main"><span class="t">Resumo do desempenho</span></span>${ui.seg([['nao', 'Não'], ['diario', 'Diário'], ['semanal', 'Domingo']], fs('est.tg_resumo', 'semanal'), 'est.prefResumo', { cls: 'sm' })}</div>
            ${sw('est.tg_relatorio_pdf', 'Relatório semanal em PDF', 'Domingo, como anexo', false)}${num('est.tg_avisos_dia', 'Máximo de avisos por dia', 6, 1, 30)}${num('est.tg_pedidos_dia', 'Máximo de pedidos por dia', 60, 5, 200)}</div></div>
        <div class="card pad-lg"><b>Assistente de IA (opcional)</b><p class="muted mt-2" style="font-size:13px">${ia.configurado ? `${(ia.provedores || []).length} provedor(es) · ${ia.uso_hoje}/${ia.limite_dia} usos hoje. Cada pessoa escolhe o modelo na hora; tudo que a IA gera vem identificado para você conferir.` : 'Desligado. Estudos funciona inteiro sem IA. O dono do app cadastra provedores (há modelos prontos com nível gratuito); as chaves ficam só no servidor.'}</p>
          <div class="row-sm wrap mt-2">${ia.configurado ? h`<a class="btn btn-ghost btn-sm" href="#/est/ia">${icon('zap', 'sm')}Abrir o assistente</a>` : ''}${ia.dono ? h`<button class="btn btn-ghost btn-sm" data-act="est.iaProv">${icon('sliders', 'sm')}Provedores e modelos</button>` : ''}</div></div>
        <div class="card pad-lg"><b>Arquivos e segurança</b><p class="muted mt-2" style="font-size:13px">Originais, anotações (JSON) e cópias exportadas ficam privados no seu Drive. O backup semanal copia os originais (uma vez por conteúdo), as anotações e um manifesto. Uploads de até 50 MB.</p>
          <div class="row-sm wrap mt-2"><button class="btn btn-ghost btn-sm" data-act="est.checkFiles">${icon('shield', 'sm')}Verificar arquivos</button><button class="btn btn-ghost btn-sm" data-act="est.dupScan">${icon('copy', 'sm')}Procurar duplicados</button></div>
          <p class="faint mt-3" style="font-size:12px">O acesso ao Prumo é por e-mail digitado e senha compartilhada: isso não comprova a posse do e-mail. Para uso pessoal está ok; para várias pessoas independentes, use contas com identidade verificada antes de confiar na separação de arquivos e no vínculo do bot.</p></div>
      </div></div>`;
  }

  async function bibLote(patch, el) {
    const ids = [...(st.bsel || [])]; if (!ids.length || Object.values(patch).some((v) => v === undefined)) return;
    if (patch.categoria === '') return;
    el.disabled = true;
    try { const r = await P.api.call('est.materialBatch', { ids, ...patch }, { mutation: true, timeout: 180000 }); r.materiais.forEach((m) => S.put('est_materiais', m)); ui.toast(`${r.materiais.length} material(is) atualizado(s) e movido(s)`); st.bsel = new Set(); }
    catch (e) { ui.toast(e.message, { error: true }); }
    P.router.render(true);
  }

  // ================= Rotas e ações =================
  const T = E.T;
  P.screen('est/biblioteca', { mod: 'est', tab: 'biblioteca', title: 'Biblioteca', deps: T.concat(['arquivos']), render: biblioteca });
  P.screen('est/sala', { mod: 'est', tab: 'sala', title: 'Sala de estudo', deps: T, render: sala, mount: salaMount, unmount() { clearInterval(st.tick); } });
  P.screen('est/revisoes', { mod: 'est', tab: 'revisoes', title: 'Revisões', deps: T, render: revisoes });
  P.screen('est/flashcards', { mod: 'est', tab: 'flashcards', title: 'Flashcards', deps: T, render: flashcards, mount(root) { P.$$('[data-cimg]', root).forEach(async (el) => { try { const u = await P.files.url(el.dataset.cimg); el.outerHTML = `<img src="${P.esc(u)}" alt="" style="max-width:100%;border-radius:12px">`; } catch (e) { el.remove(); } }); } });
  P.screen('est/erros', { mod: 'est', tab: 'erros', title: 'Caderno de erros', deps: T, render: erros });
  P.screen('est/resumos', { mod: 'est', tab: 'resumos', title: 'Resumos e anotações', deps: T, render: resumos });
  P.screen('est/discursivas', { mod: 'est', tab: 'discursivas', title: 'Discursivas', deps: T, render: discursivas });
  P.screen('est/desempenho', { mod: 'est', tab: 'desempenho', title: 'Desempenho', deps: ['est_sessoes'], render: desempenho, mount: desMount });
  P.screen('est/historico', { mod: 'est', tab: 'historico', title: 'Histórico', deps: T, render: historico });
  P.screen('est/prefs', { mod: 'est', tab: 'prefs', title: 'Preferências de Estudos', deps: [], render: prefs });

  const setPref = (vals) => P.settings.set(vals).then(() => ui.toast('Preferência salva')).catch(() => {});
  document.addEventListener('keydown', (e) => {
    if (!st.cardQ || !st.cardShow || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
    const k = { 1: 'errei', 2: 'dificil', 3: 'bom', 4: 'facil' }[e.key]; if (k) P.act['est.cardGrade']({ dataset: { v: k } });
  });

  Object.assign(P.act, {
    'est.start': (el) => startFlow(el.dataset || {}).catch((e) => { if (e.code !== 'CANCEL') ui.toast(e.message, { error: true }); }),
    'est.startTask': (el) => startFlow({ tarefa: el.dataset.id }).catch((e) => { if (e.code !== 'CANCEL') ui.toast(e.message, { error: true }); }),
    'est.sessPause': async (el) => { try { const r = await P.api.call('est.sessionPause', { id: el.dataset.id }, { mutation: true }); S.put('est_sessoes', r.sessao); } catch (e) { ui.toast(e.message, { error: true }); } },
    'est.sessResume': async (el) => { try { const r = await P.api.call('est.sessionResume', { id: el.dataset.id }, { mutation: true }); S.put('est_sessoes', r.sessao); } catch (e) { ui.toast(e.message, { error: true }); } },
    'est.sessEnd': (el) => endSheet(S.get('est_sessoes', el.dataset.id)),
    'est.sessNote': P.debounce((el) => { const s = E.open(); if (!s) return; const o = localGet(s.id); o[el.dataset.k] = el.value; localSet(s.id, o); }, 400),
    'est.sessMat': (el) => { const s = S.get('est_sessoes', el.dataset.id); ui.menu('Material da sessão', S.all('est_materiais').filter((m) => m.situacao !== 'arquivado').slice(0, 40).map((m) => ({ label: m.codigo + ' · ' + m.titulo, icon: 'book', act: () => matOpen(m.id) }))); return s; },
    'est.sessEdit': (el) => sessEdit(S.getAny('est_sessoes', el.dataset.id)),
    'est.manual': () => manualSheet(),
    'est.matUpload': async () => { const files = await P.files.pick({ accept: 'application/pdf,image/\u002A,.xlsx,.csv,.txt', multiple: true }); if (files && files.length) E.uploadToLibrary(files, { disciplina_id: P.flt.get('est.bib', 'disc', '') || undefined }); },
    'est.matLink': () => matEdit(null),
    'est.matOpen': (el) => matOpen(el.dataset.id, el.dataset.p ? +el.dataset.p : null),
    'est.matMenu': (el) => matMenu(E.mat(el.dataset.id)),
    'est.lixeira': async () => { try { const r = await P.api.call('est.trashList', {}); st.lixeira = r.materiais; } catch (e) { ui.toast(e.message, { error: true }); } P.router.render(true); },
    'est.lixeiraFechar': () => { st.lixeira = null; P.router.render(true); },
    'est.matRestore': async (el) => { try { const r = await P.api.call('db.restore', { table: 'est_materiais', id: el.dataset.id }, { mutation: true }); S.put('est_materiais', r.row); st.lixeira = st.lixeira.filter((m) => m.id !== el.dataset.id); ui.toast('Material restaurado'); } catch (e) { ui.toast(e.message, { error: true }); } P.router.render(true); },
    'est.revDone': async (el) => { const btns = el.parentNode; btns.querySelectorAll('button').forEach((b) => { b.disabled = true; }); try { const r = await P.api.call('est.reviewDone', { id: el.dataset.id, resultado: el.dataset.v }, { mutation: true }); S.put('est_revisoes', r.revisao); if (r.proxima) S.put('est_revisoes', r.proxima); ui.toast(r.proxima ? `Próxima revisão em ${fmt.date(r.proxima.vencimento)}` : 'Revisão registrada'); } catch (e) { ui.toast(e.message, { error: true }); btns.querySelectorAll('button').forEach((b) => { b.disabled = false; }); } },
    'est.revOpen': (el) => revOpen(S.get('est_revisoes', el.dataset.id)),
    'est.revAgendar': (el) => revAgendar(el.dataset && el.dataset.tipo, el.dataset && el.dataset.id),
    'est.cardNew': (el) => cardEdit(null, { disciplina_id: (el && el.dataset && el.dataset.disc) || null, assunto_id: (el && el.dataset && el.dataset.ass) || null }),
    'est.cardEdit': (el) => cardEdit(S.get('est_flashcards', el.dataset.id)),
    'est.cardStart': () => {
      const hoje = D.today(), bar = P.flt.get('est.fc', 'baralho', ''), lim = +fs('est.cards_novos_dia', 20) || 20;
      const novosHoje = S.where('est_flashcard_revisoes', (r) => String(r.data).slice(0, 10) === hoje && r.intervalo_antes === 0).length;
      const pool = S.all('est_flashcards').filter((c) => !c.suspenso && (!bar || c.baralho === bar));
      const q = pool.filter((c) => !c.novo && c.vencimento && c.vencimento <= hoje).sort((a, b) => (a.vencimento < b.vencimento ? -1 : 1)).concat(pool.filter((c) => c.novo).slice(0, Math.max(0, lim - novosHoje)));
      if (!q.length) { ui.toast('Nada para estudar agora.'); return; }
      st.cardQ = q.map((c) => c.id); st.cardI = 0; st.cardShow = false; P.router.render();
    },
    'est.cardReveal': () => { st.cardShow = true; P.router.render(true); },
    'est.cardStop': () => { st.cardQ = null; P.router.render(); },
    'est.cardGrade': async (el) => {
      const id = st.cardQ && st.cardQ[st.cardI]; if (!id) return;
      st.cardShow = false; st.cardI++;
      if (st.cardI >= st.cardQ.length) { const n = st.cardQ.length; st.cardQ = null; ui.toast(`Sessão concluída: ${n} cartão(ões)`); }
      P.router.render(true);
      try { const r = await P.api.call('est.cardAnswer', { card_id: id, nota: el.dataset.v, op_key: P.uuid() }, { mutation: true }); S.put('est_flashcards', r.card); S.put('est_flashcard_revisoes', r.revisao); } catch (e) { ui.toast(e.message, { error: true }); }
    },
    'est.erroNew': (el) => erroEdit(null, { disciplina_id: (el && el.dataset && el.dataset.disc) || null, assunto_id: (el && el.dataset && el.dataset.ass) || null }),
    'est.erroEdit': (el) => erroEdit(S.get('est_erros', el.dataset.id)),
    'est.tgErros': (el) => E.sendTg({ tipo: 'erros', termo: P.flt.get('est.err', 'q', '') }, el),
    'est.noteNew': (el) => noteEdit(null, { disciplina_id: (el && el.dataset && el.dataset.disc) || null, assunto_id: (el && el.dataset && el.dataset.ass) || null, material_id: (el && el.dataset && el.dataset.mat) || null }),
    'est.noteEdit': (el) => noteEdit(S.get('est_anotacoes', el.dataset.id)),
    'est.resumoView': (el) => E.resumoView(S.get('est_anotacoes', el.dataset.id)),
    'est.resumoIA': (el) => E.resumoIA(E.mat(el.dataset.id)),
    'est.noteLink': (el) => { const n = S.all('est_anotacoes').find((x) => P.norm(x.titulo) === P.norm(el.dataset.t)); if (n) { ui.closeAll(); noteEdit(n); } else ui.toast('Nenhuma nota com esse título.'); },
    'est.discNew': () => discEdit(null),
    'est.discEdit': (el) => discEdit(S.get('est_discursivas', el.dataset.id)),
    'est.desLoad': () => loadStats(),
    'est.desDrill': (el) => desDrill(el.dataset.k),
    'est.desTg': (el) => { const r0 = st.statsRes; if (!r0) return; E.sendTg({ tipo: 'relatorio', de: r0.periodo.de, ate: r0.periodo.ate, concurso_id: r0.filtros.concurso_id, disciplina_id: r0.filtros.disciplina_id, formato: 'pdf' }, el); },
    'est.pref': (el) => setPref({ [el.dataset.k]: el.checked }),
    'est.prefNum': (el) => { const v = Math.round(P.parseNum(el.value)); if (!(v >= +el.dataset.min && v <= +el.dataset.max)) { ui.toast(`Use um valor entre ${el.dataset.min} e ${el.dataset.max}.`, { error: true }); return; } setPref({ [el.dataset.k]: v }); },
    'est.prefOcr': (el) => setPref({ 'est.ocr_motor': el.dataset.v }).then(() => P.router.render(true)),
    'est.prefTxt': (el) => { if (el.dataset.k === 'est.tg_silencio' && el.value && !/^\d\d:\d\d-\d\d:\d\d$/.test(el.value)) { ui.toast('Use o formato 22:00-07:00', { error: true }); return; } setPref({ [el.dataset.k]: el.value }); },
    'est.prefIv': (el) => { const v = el.value.split(/[,; ]+/).map(Number).filter((n) => n > 0 && n < 3650); if (!v.length) { ui.toast('Informe dias, ex.: 1, 7, 15, 30', { error: true }); return; } setPref({ 'est.rev_intervalos': v }); },
    'est.prefCores': (el) => { const v = el.value.split(/[,; ]+/).filter((c) => /^#[0-9a-f]{6}$/i.test(c)); if (!v.length) { ui.toast('Use cores como #F2B705', { error: true }); return; } setPref({ 'est.cores': v }); },
    'est.prefTg': (el) => setPref({ 'est.tg_avisos': el.checked }),
    'est.prefDia': (el) => { const cur = new Set(String(fs('est.tg_dias', '0,1,2,3,4,5,6')).split(',').filter(Boolean)); cur.has(el.dataset.v) ? cur.delete(el.dataset.v) : cur.add(el.dataset.v); setPref({ 'est.tg_dias': [...cur].sort().join(',') }).then(() => P.router.render(true)); },
    'est.prefTgTipo': (el) => { const cur = new Set(fs('est.tg_tipos', ['plano', 'revisoes', 'prazos', 'metas']) || []); cur.has(el.dataset.v) ? cur.delete(el.dataset.v) : cur.add(el.dataset.v); setPref({ 'est.tg_tipos': [...cur] }).then(() => P.router.render(true)); },
    'est.prefResumo': (el) => setPref({ 'est.tg_resumo': el.dataset.v }).then(() => P.router.render(true)),
    'est.metaNew': (el) => { const ds = el.dataset; S.save('met_metas', { titulo: ds.l, area: 'estudos', horizonte: 'curto', medicao: 'automatica', origem_metrica: ds.k, origem_id: ds.k === 'est_cobertura' ? E.ctx() || null : null, valor_alvo: +ds.alvo, unidade: ds.u, data_inicio: D.today(), prazo: D.add(D.today(), 90), status: 'ativa' }).then((m) => { ui.toast('Meta criada: ajuste o alvo e o prazo em Metas.'); P.router.go('met/meta/' + m.id); }).catch(() => {}); },
    'est.iaCfg': () => P.act['est.iaProv'](),
    'est.bibSel': (el) => { el.checked ? st.bsel.add(el.dataset.id) : st.bsel.delete(el.dataset.id); P.router.render(true); },
    'est.bibSelClear': () => { st.bsel = new Set(); P.router.render(true); },
    'est.bibLoteCat': (el) => { if (el.value) bibLote({ categoria: el.value }, el); },
    'est.bibLoteConc': (el) => { if (el.value) bibLote({ concurso_ids: el.value === '_geral' ? '' : el.value }, el); },
    'est.libReorg': async (el) => {
      el.classList.add('loading');
      let r; try { r = await P.api.call('est.libReorg', { dry: true }, { timeout: 120000 }); } catch (e) { ui.toast(e.message, { error: true }); el.classList.remove('loading'); return; }
      el.classList.remove('loading');
      if (!r.total) { ui.toast('A biblioteca já está organizada nas pastas certas.', { icon: 'check' }); return; }
      const destinos = {}; r.itens.forEach((x) => { destinos[x.para] = (destinos[x.para] || 0) + 1; });
      ui.sheet({ title: 'Reorganizar biblioteca', body: h`<p class="muted" style="font-size:13px">${r.total} arquivo(s) vão para a estrutura Estudos / tipo / concurso / data do envio / categoria. Mover não muda o arquivo: os links, o histórico e as anotações continuam valendo. Materiais sem categoria vão para "Outros" (classifique depois em lote).</p>
        <div class="group-h mt-3">Destinos</div><div class="list">${Object.entries(destinos).map(([d, n]) => h`<div class="li"><span class="main"><span class="t">${d.split('/').join(' / ')}</span></span><span class="v num">${n}</span></div>`)}</div>
        <details class="mt-3"><summary class="faint" style="font-size:12.5px">Ver arquivo por arquivo</summary><div class="list mt-2">${r.itens.map((x) => h`<div class="li"><span class="main"><span class="t">${x.codigo} · ${x.titulo}</span><span class="s">${x.de} → ${x.para}</span></span></div>`)}</div></details>`,
        foot: h`<button class="btn btn-primary grow" data-ok>Mover ${r.total} arquivo(s)</button>`,
        onMount(sh) { sh.$('[data-ok]').onclick = async (ev) => { ev.currentTarget.classList.add('loading'); try { const o = await P.api.call('est.libReorg', { dry: false }, { mutation: true, timeout: 330000 }); sh.close(); await E.reload().catch(() => {}); ui.toast(`${o.movidos} arquivo(s) reorganizado(s)${o.pendentes ? `; faltam ${o.pendentes} (clique de novo para continuar)` : ''}`); } catch (e) { ui.toast(e.message, { error: true }); ev.currentTarget && ev.currentTarget.classList.remove('loading'); } }; } });
    },
    'est.dupScan': async (el) => {
      el.classList.add('loading');
      let r; try { r = await P.api.call('est.dupScan', {}, { timeout: 120000 }); } catch (e) { ui.toast(e.message, { error: true }); el.classList.remove('loading'); return; }
      el.classList.remove('loading');
      const mb = (b) => fmt.num(b / 1048576, 1) + ' MB';
      if (!r.itens.length) { ui.toast('Nenhum arquivo duplicado nas pastas de Estudos.', { icon: 'check' }); return; }
      ui.sheet({ title: 'Arquivos duplicados', body: h`<p class="muted" style="font-size:13px">${r.itens.length} arquivo(s) que não são a versão atual: cópias anotadas antigas do mesmo material e arquivos com conteúdo igual que nada usa. Vão para a lixeira (do Drive e do app); dá para desfazer. Libera ${mb(r.bytes)}.</p>
        <div class="list mt-2">${r.itens.map((x) => h`<label class="li"><input type="checkbox" data-dup="${x.id}" checked><span class="main"><span class="t">${x.nome}</span><span class="s">${x.tipo} · ${x.motivo}${x.material ? ' · ' + x.material : ''}</span></span><span class="v num">${mb(x.bytes)}</span></label>`)}</div>`,
        foot: h`<button class="btn btn-primary grow" data-ok style="background:var(--danger);border-color:var(--danger)">Mandar para a lixeira</button>`,
        onMount(sh) {
          sh.$('[data-ok]').onclick = async (ev) => {
            const btn = ev.currentTarget, ids = P.$$('[data-dup]', sh.el).filter((c) => c.checked).map((c) => c.dataset.dup); if (!ids.length) return;
            if (!(await ui.confirm({ title: `Mandar ${ids.length} arquivo(s) para a lixeira?`, text: 'Ficam na lixeira do Drive por 30 dias e você pode desfazer agora.', ok: 'Mandar para a lixeira', danger: true }))) return;
            btn.classList.add('loading');
            try {
              const out = await P.api.call('est.dupClean', { ids }, { mutation: true, timeout: 120000 }); sh.close();
              ui.toast(`${out.removidos.length} arquivo(s) na lixeira · ${mb(out.bytes)} liberados`, { undo: async () => { try { const rr = await P.api.call('est.dupRestore', { ids: out.removidos }, { mutation: true, timeout: 120000 }); ui.toast(`${rr.restaurados} arquivo(s) restaurado(s)`); } catch (e) { ui.toast(e.message, { error: true }); } }, duration: 10000 });
            } catch (e) { ui.toast(e.message, { error: true }); }
          };
        } });
    },
    'est.checkFiles': async (el) => {
      el.classList.add('loading');
      try {
        const r = await P.api.call('est.checkFiles', {}, { timeout: 120000 });
        if (!r.faltando.length) ui.toast('Todos os arquivos da biblioteca estão no Drive.', { icon: 'check' });
        else ui.sheet({ title: 'Arquivos ausentes', body: h`<div class="list">${r.faltando.map((x) => h`<div class="li"><span class="main"><span class="t">${x.codigo} · ${x.titulo}</span><span class="s">${x.copia ? 'há cópia no backup' : 'sem cópia no backup'}</span></span></div>`)}</div>`, foot: r.faltando.some((x) => x.copia) ? h`<button class="btn btn-primary" data-r>Restaurar do backup</button>` : '', onMount(sh) { const b = sh.$('[data-r]'); if (b) b.onclick = async () => { try { const r2 = await P.api.call('est.checkFiles', { restaurar: true }, { mutation: true, timeout: 180000 }); sh.close(); ui.toast(`${r2.faltando.filter((x) => x.restaurado).length} arquivo(s) restaurado(s)`); } catch (e) { ui.toast(e.message, { error: true }); } }; } });
      } catch (e) { ui.toast(e.message, { error: true }); } el.classList.remove('loading');
    }
  });
})();
</script>
