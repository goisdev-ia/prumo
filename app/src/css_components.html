<style>
/* ===== Layout utilitário ===== */
.stack { display: flex; flex-direction: column; gap: var(--s-4); }
.stack-sm { display: flex; flex-direction: column; gap: var(--s-2); }
.row { display: flex; align-items: center; gap: var(--s-3); }
.row-sm { display: flex; align-items: center; gap: var(--s-2); }
.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; } .end { justify-content: flex-end; }
.grid { display: grid; gap: var(--s-3); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
.g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dash { display: grid; gap: var(--s-3); grid-template-columns: minmax(0, 1fr); }
.mt-2 { margin-top: var(--s-2); } .mt-3 { margin-top: var(--s-3); } .mt-4 { margin-top: var(--s-4); } .mt-6 { margin-top: var(--s-6); }
.mb-2 { margin-bottom: var(--s-2); } .mb-3 { margin-bottom: var(--s-3); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide-m { display: none !important; }
@media (min-width: 640px) { .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hide-t { display: none !important; } }
@media (min-width: 1024px) {
  .hide-m { display: revert !important; } .hide-d { display: none !important; }
  .dash { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-4); }
  .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
  .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
}
@media (min-width: 640px) and (max-width: 1023px) { .span-12, .span-t2 { grid-column: span 2; } }

/* ===== Cabeçalho de página ===== */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-3); margin: var(--s-1) 0 var(--s-4); flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.page-head p { color: var(--text-2); margin-top: 4px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: var(--s-5) 0 var(--s-2); }
.section-title .row-sm { flex-wrap: wrap; }
.section-title h2 { font-size: 16px; }
.section-title .link { font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 2px; }

/* ===== Cartões ===== */
.card {
  background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: var(--r-card);
  box-shadow: var(--shadow); padding: 14px; min-width: 0; position: relative;
}
.card.flat { box-shadow: none; }
.card.tint { background: var(--primary-tint); border-color: transparent; }
.card.accent { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.card.accent .muted { color: rgba(26, 26, 26, .66); }
.card.pad-lg { padding: var(--s-4); }
.card.link { cursor: pointer; transition: transform var(--t-fast) var(--ease), border-color var(--t-fast); }
.card.link:active { transform: scale(.985); }
@media (hover: hover) { .card.link:hover { border-color: var(--border); } }
.card-head { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-2); min-height: 26px; }
.card-head h3 { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; }
.card-head .ic { color: var(--text-2); }
.card-head .go { color: var(--text-3); }
.card-foot { margin-top: var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--border-soft); }

/* ===== Métrica ===== */
.metric .label { font-size: 13px; color: var(--text-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.metric .value { font-size: 24px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.metric .value.xl { font-size: 34px; }
.metric .value.md { font-size: 18px; }
.metric .unit { font-size: 14px; font-weight: 600; color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
.metric .sub { font-size: 12.5px; color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ===== Chips e badges ===== */
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.chip .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.chip.up { background: var(--success-tint); color: var(--success); }
.chip.down { background: var(--danger-tint); color: var(--danger); }
.chip.acc { background: var(--primary-tint); color: var(--primary-ink); }
.chip.info { background: var(--info-tint); color: var(--info); }
.chip.solid { background: var(--primary); color: var(--on-primary); }
.chip.lg { height: 34px; padding: 0 14px; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.badge { position: absolute; top: 6px; right: 6px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--bg); }

/* ===== Botões ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-pill);
  font-weight: 600; font-size: 14px; background: var(--surface-2); color: var(--text); border: 1px solid transparent; white-space: nowrap;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast), opacity var(--t-fast); user-select: none;
}
.btn:active { transform: scale(.97); }
.btn[disabled], .btn.loading { opacity: .55; pointer-events: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-quiet { background: transparent; color: var(--text-2); padding: 0 10px; }
.btn-danger { background: var(--danger-tint); color: var(--danger); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13px; }
.btn-xs { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn-icon { width: 44px; height: 44px; padding: 0; border-radius: 50%; background: transparent; color: var(--text); position: relative; display: inline-grid; place-items: center; }
.btn-icon.filled { background: var(--surface-2); }
.btn-icon.sm { width: 36px; height: 36px; }
@media (hover: hover) { .btn-icon:hover { background: var(--surface-2); } .btn-ghost:hover { background: var(--surface-2); } }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Segmentado e abas ===== */
.seg { display: flex; padding: 4px; gap: 2px; background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: var(--r-pill); }
.seg button { flex: 1; height: 36px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; color: var(--text-2); padding: 0 12px; white-space: nowrap; transition: background var(--t-fast), color var(--t-fast); }
.seg button.on { background: var(--primary); color: var(--on-primary); }
.seg.sm button { height: 30px; font-size: 12.5px; }
.chips { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 calc(var(--s-4) * -1); padding-left: var(--s-4); padding-right: var(--s-4); }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 34px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--border); color: var(--text-2); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fchip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
@media (min-width: 1024px) { .chips { margin: 0; padding-left: 0; padding-right: 0; flex-wrap: wrap; } }

/* ===== Formulários ===== */
.form { display: flex; flex-direction: column; gap: var(--s-4); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
.field .err { font-size: 12px; color: var(--danger); font-weight: 600; display: none; }
.field.invalid .err { display: block; }
.field.invalid .input { border-color: var(--danger); }
.input {
  width: 100%; height: 48px; padding: 0 14px; border-radius: var(--r-input); background: var(--surface-2); border: 1px solid var(--border-soft);
  font-size: 15px; outline: none; transition: border-color var(--t-fast), background var(--t-fast); min-width: 0;
}
.input:focus { border-color: var(--primary); background: var(--surface-1); }
.input::placeholder { color: var(--text-3); }
textarea.input { height: auto; min-height: 92px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
select.input { appearance: none; -webkit-appearance: none; padding-right: 38px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .prefix { position: absolute; left: 14px; color: var(--text-2); font-weight: 600; pointer-events: none; }
.input-wrap .prefix + .input { padding-left: 44px; }
.input-wrap .suffix { position: absolute; right: 14px; color: var(--text-3); font-size: 13px; pointer-events: none; }
.input-wrap .btn-icon { position: absolute; right: 2px; }
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search .input { padding-left: 44px; height: 44px; border-radius: var(--r-pill); }
.amount { text-align: center; padding: var(--s-3) 0 var(--s-2); }
.amount input { width: 100%; background: none; border: 0; outline: none; text-align: center; font-size: 42px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--text); }
.amount .cur { font-size: 15px; color: var(--text-2); font-weight: 600; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--text); box-shadow: inset 0 0 0 3px var(--surface-1); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 15px; background: var(--surface-3); border: 1px solid var(--border); transition: background var(--t); }
.toggle span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform var(--t) var(--ease); }
.toggle input:checked + span { background: var(--primary); border-color: var(--primary); }
.toggle input:checked + span::after { transform: translateX(20px); background: var(--on-primary); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex: none; transition: all var(--t-fast); color: transparent; }
.check .ic { width: 15px; height: 15px; stroke-width: 3; }
.check.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.check.part { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-ink); }
.check.skip { border-style: dashed; color: var(--text-3); }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: var(--r-pill); border: 1px solid var(--border-soft); }
.stepper button { width: 40px; height: 40px; display: grid; place-items: center; }
.stepper input { width: 56px; text-align: center; background: none; border: 0; outline: none; font-weight: 700; font-size: 16px; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s-2); }
.opt { border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--text-2); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.opt.on { border-color: var(--primary); background: var(--primary-tint); color: var(--text); }

/* ===== Listas ===== */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: var(--s-3); padding: 8px 0; min-height: 48px; position: relative; }
.li + .li { border-top: 1px solid var(--border-soft); }
.list.cardlist { background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: var(--r-card); padding: 0 var(--s-4); box-shadow: var(--shadow); }
.li .main { flex: 1; min-width: 0; }
.li .t { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.li .v small { display: block; font-size: 11.5px; font-weight: 500; color: var(--text-3); margin-top: 2px; }
.li.tap { cursor: pointer; }
.li.done .t { text-decoration: line-through; color: var(--text-3); }
.tile { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--text); }
.tile.sm { width: 34px; height: 34px; border-radius: 11px; }
.tile .ic { width: 20px; height: 20px; }
.group-h { font-size: 12px; font-weight: 700; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; padding: var(--s-4) 0 var(--s-1); display: flex; justify-content: space-between; }
.kv { display: flex; justify-content: space-between; gap: var(--s-3); padding: 9px 0; font-size: 14px; }
.kv + .kv { border-top: 1px dashed var(--border-soft); }
.kv span:first-child { color: var(--text-2); }
.kv b { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.swipe-wrap { position: relative; overflow: hidden; }
.swipe-act { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 13px; font-weight: 700; }
.swipe-act .l { color: var(--success); display: flex; gap: 6px; align-items: center; }
.swipe-act .r { color: var(--primary-ink); display: flex; gap: 6px; align-items: center; }
.swipe-body { position: relative; background: inherit; transition: transform var(--t) var(--ease); touch-action: pan-y; }

/* ===== Progresso, anéis, barras ===== */
.progress { height: 8px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width var(--t-slow) var(--ease); }
.progress.thin { height: 5px; } .progress.thick { height: 12px; }
.progress.warn > i { background: var(--c4); } .progress.over > i { background: var(--danger); } .progress.ok > i { background: var(--success); }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-track { stroke: var(--track); }
.ring .ring-val { transition: stroke-dashoffset 600ms var(--ease); }
.ring .ring-label { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring .ring-label b { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: block; }
.ring .ring-label small { font-size: 11px; color: var(--text-2); font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; position: relative; }
.bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
.bars .bar i { width: 100%; max-width: 30px; border-radius: 8px; background: var(--primary-soft); opacity: .55; min-height: 4px; transition: height var(--t-slow) var(--ease); }
.bars .bar.hi i { background: var(--primary); opacity: 1; }
.bars .bar.zero i { background: var(--track); opacity: 1; }
.bars .bar span { font-size: 11px; color: var(--text-3); font-weight: 600; }
.bars .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--text-3); pointer-events: none; }
.gauge text { font-family: var(--font); }

/* ===== Faixa de datas ===== */
.datestrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: var(--s-2) 0 var(--s-4); }
.datestrip button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-radius: 18px; color: var(--text-2); font-size: 13px; position: relative; }
.datestrip button b { font-size: 17px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.datestrip button.on { background: var(--primary); color: var(--on-primary); }
.datestrip button.on b { color: var(--on-primary); }
.datestrip button.today:not(.on) b { color: var(--primary-ink); }
.datestrip button .mk { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
.datestrip button.on .mk { background: var(--on-primary); }

/* ===== Avatar e appbar ===== */
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; flex: none; font-weight: 700; color: var(--primary-ink); border: 1px solid var(--border-soft); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 88px; height: 88px; font-size: 28px; }
.avatar.sm { width: 34px; height: 34px; font-size: 13px; }
.appbar { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) 0; }
.appbar .hello { font-size: 13px; color: var(--text-2); }
.appbar .name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.mod-switch { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 6px; border-radius: var(--r-pill); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.mod-switch .tile { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-tint); color: var(--primary-ink); }
.mod-switch .ic.chev { width: 16px; height: 16px; color: var(--text-3); }
.streak { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--border); font-weight: 700; font-size: 14px; }
.streak .ic { color: var(--c4); width: 18px; height: 18px; }

.link-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; margin: -4px -6px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
.link-btn:hover { background: var(--surface-2); }
.link-btn .ic { opacity: .6; }

/* ===== Sheets, diálogos, toasts ===== */
.layer { position: fixed; inset: 0; z-index: 100; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--t-slow) var(--ease); }
.layer.open .scrim { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 94dvh; display: flex; flex-direction: column; background: var(--surface-1);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0; transform: translateY(100%); transition: transform 280ms var(--ease); box-shadow: var(--shadow-pop);
  padding-bottom: var(--safe-b); border-top: 1px solid var(--border-soft);
}
.layer.open .sheet { transform: none; }
.sheet.full { height: 94dvh; }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 10px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-3) var(--s-4) var(--s-2) var(--s-5); flex: none; }
.sheet-head h2 { flex: 1; font-size: 19px; min-width: 0; }
.sheet-body { flex: 1; overflow-y: auto; padding: var(--s-2) var(--s-5) var(--s-5); overscroll-behavior: contain; }
.sheet-foot { flex: none; display: flex; gap: var(--s-2); padding: var(--s-3) var(--s-5) var(--s-4); border-top: 1px solid var(--border-soft); background: var(--surface-1); }
.sheet-foot .btn { flex: 1; }
@media (min-width: 1024px) {
  .sheet { left: auto; top: 0; width: 480px; max-height: none; height: 100dvh; border-radius: var(--r-sheet) 0 0 var(--r-sheet); transform: translateX(100%); border-top: 0; border-left: 1px solid var(--border-soft); }
  .sheet.full { height: 100dvh; } .sheet.wide { width: 720px; }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: var(--s-5); }
}
.dialog { position: absolute; left: 50%; top: 50%; width: min(400px, calc(100% - 32px)); transform: translate(-50%, -46%) scale(.98); opacity: 0; transition: all var(--t) var(--ease); background: var(--surface-1); border-radius: 24px; padding: var(--s-6); border: 1px solid var(--border-soft); box-shadow: var(--shadow-pop); }
.layer.open .dialog { transform: translate(-50%, -50%); opacity: 1; }
.dialog h2 { font-size: 19px; margin-bottom: 8px; }
.dialog p { color: var(--text-2); }
.dialog .actions { display: flex; gap: var(--s-2); margin-top: var(--s-5); }
