<script>
/* Prumo · Estudos: leitura de PDF de questões (cadernos de questões, provas, listas).
   Lê o texto com as posições (PDF.js), separa colunas, junta linhas e hifenização, e reconhece: número da questão,
   banca/ano/órgão/cargo (entre parênteses ou "Banca: … Ano: …"), enunciado completo, alternativas A–E ou A–D
   (inclusive várias na mesma linha), certo/errado (C/E, V/F), textos de apoio ("Leia o texto…", "Texto I"), assunto
   (títulos), disciplina (sumário, cabeçalho das páginas), gabarito (tabelas "GABARITO" por disciplina ou "Gabarito: B"
   depois da questão), comentários e imagens dentro da questão (posição na página para recortar).
   O resultado sai nas mesmas colunas do modelo XLSX de questões, com avisos do que precisa ser conferido.
   Funciona no navegador e no Node (testes). */
(function (root) {
  'use strict';
  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const MIN = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'a', 'o', 'as', 'os', 'na', 'no', 'nas', 'nos', 'para', 'com', 'por', 'ao', 'aos', 'à', 'às']);
  const SIGLAS = new Set(['ti', 'sfn', 'lgpd', 'cmn', 'bb', 'pix', 'sql', 'ia', 'cf', 'clt', 'stf', 'stj', 'ii', 'iii', 'iv']);
  function titleCase(s) {
    return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim().split(' ').map((w, i) => {
      if (SIGLAS.has(w.replace(/[^a-z]/g, ''))) return w.toUpperCase();
      if (i && MIN.has(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  const isUpper = (s) => /[A-ZÀ-Ý]/.test(s) && !/[a-zß-ÿ]/.test(s);

  // ================= 1. linhas de uma página =================
  /**
   * @param {{str,x,y,w,size,rot}[]} items  texto da página (coordenadas do PDF: y cresce para cima)
   * @param {{n,width,height}} page
   * @param {{x0,y0,x1,y1}[]} imgs  imagens desenhadas na página
   */
  function pageLines(items, page, imgs) {
    const out = { n: page.n, width: page.width, height: page.height, header: [], nums: [], lines: [] };
    let txt = [];
    items.forEach((it) => { const s = String(it.str || ''); if (!s) return; if (it.rot) { if (s.trim()) out.header.push(s.trim()); return; } txt.push({ ...it, str: s, sp: !s.trim() }); });
    txt.forEach((it) => { if ((it.y < 45 || it.y > page.height - 40) && /^\d{1,4}$/.test(it.str.trim())) out.nums.push(+it.str.trim()); });
    // número de página na margem lateral (fora da mancha do texto): não entra nas linhas
    txt = txt.filter((it) => !((it.y < 45 || it.y > page.height - 40) && /^\d{1,4}$/.test(it.str.trim()) && (it.x < 50 || it.x + it.w > page.width - 45)));
    if (!txt.length && !(imgs || []).length) return out;
    const mid = page.width / 2, tot = txt.reduce((a, it) => a + (it.w || 1), 0) || 1;
    const cross = txt.filter((it) => it.x < mid - 6 && it.x + it.w > mid + 6).reduce((a, it) => a + it.w, 0);
    const two = cross / tot < 0.06 && txt.length > 3 && txt.some((it) => it.x >= mid) && txt.some((it) => it.x + it.w <= mid);
    const cols = two ? [txt.filter((it) => it.x + it.w / 2 < mid), txt.filter((it) => it.x + it.w / 2 >= mid)] : [txt];
    cols.forEach((col, ci) => {
      const sorted = col.slice().sort((a, b) => b.y - a.y || a.x - b.x), lines = [];
      sorted.forEach((it) => {
        if (it.sp) { const L0 = lines[lines.length - 1]; if (L0 && Math.abs(L0.y - it.y) <= Math.max(1.6, (it.size || 9) * 0.35)) L0.items.push(it); return; }
        const sz = it.size || 9, L = lines[lines.length - 1];
        if (L && Math.abs(L.y - it.y) <= Math.max(1.6, sz * 0.35)) L.items.push(it); else lines.push({ y: it.y, items: [it] });
      });
      lines.forEach((L) => { L.items = L.items.filter((i) => !i.sp || L.items.some((j) => !j.sp)); });
      for (let k = lines.length - 1; k >= 0; k--) if (!lines[k].items.some((i) => !i.sp)) lines.splice(k, 1);
      const starts = lines.map((L) => Math.min(...L.items.filter((i) => !i.sp).map((i) => i.x))).sort((a, b) => a - b);
      const colLeft = starts.length ? starts[Math.floor(starts.length * 0.1)] : 0;
      const colRight = Math.max(0, ...col.map((i) => i.x + i.w));
      const built = lines.map((L) => {
        const all = L.items.sort((a, b) => a.x - b.x), its = all.filter((i) => !i.sp); let s = '', prev = null;
        const spAt = all.filter((i) => i.sp).map((i) => i.x);
        its.forEach((it) => {
          if (prev && spAt.some((x) => x >= prev.x + prev.w - 0.5 && x <= it.x + 0.5) && !/\s$/.test(s)) s += ' ';
          if (prev) { const gap = it.x - (prev.x + prev.w), sz = it.size || 9; if (gap > sz * 4) s += ' | '; else if (gap > sz * 0.12 && !/\s$/.test(s) && !/^\s/.test(it.str)) s += ' '; }
          s += it.str; prev = it;
        });
        const last = its[its.length - 1];
        return { text: s.replace(/\s+/g, ' ').trim(), x: its[0].x, xr: last.x + last.w, y: L.y, size: Math.max(...its.map((i) => i.size || 9)), page: page.n, col: ci, colLeft, colRight,
          soft: /^[-‐­]$/.test(last.str.trim()) && its.length > 1 };
      });
      (imgs || []).forEach((b) => {
        const cx = (b.x0 + b.x1) / 2;
        if (two && (ci === 0) !== (cx < mid)) return;
        built.push({ img: true, bbox: b, y: b.y1, x: b.x0, page: page.n, col: ci, colLeft, colRight, size: 9, text: '' });
      });
      built.sort((a, b) => b.y - a.y || a.x - b.x);
      built.forEach((l, i) => { const p = built[i - 1]; l.gap = p ? (p.img ? 0 : p.y - l.y) : 999; });
      out.lines.push(...built);
    });
    return out;
  }

  // ================= 2. leitura das questões =================
  const QSTART = /^(?:quest[ãa]o\s*)?(\d{1,4})\s*(?:[.)]\s*(?=\()|\s(?=\([A-Za-zÀ-ú])|[.)\-–—]\s+|º\s*[.)\-–]?\s*)(?:\(([^)]{2,200})\)?)?\s*(.*)$/i;
  const QWORD = /^quest[ãa]o\s+(\d{1,4})\b[\s.:\-–]*(.*)$/i;
  const ALT = /^\(?([a-eA-E])(?:\s*[)\]]\s*|\s*\.\s+|\s+[-–]\s+)(.*)$/;
  const ALT2 = /^\(([a-eA-E])\)\s*(.*)$/;
  const HEAD = /^[ÆĀ►▶■•➤➢❯→⮚➔➜➔➢➜]\s*(.+)$/;
  const GABH = /^(gabaritos?|gabarito oficial|respostas|answer key)\b[\s:.\-–]*(.*)$/i;
  const GABPAIR = /(\d{1,4})[\s|]*[-–.:)]?[\s|]*(ANULADA|NULA|CERTO|ERRADO|[A-E]|[VF]|\*|X)(?=\s|$|[,;|])/gi;
  const GABLINE = /^(?:gabarito|resposta|resp\.|alternativa correta|letra correta)\s*[:\-–]?\s*(?:letra\s*)?\(?\s*(ANULADA|CERTO|ERRADO|[A-E]|[VF])\s*\)?\.?\s*$/i;
  const EXPL = /^(coment[áa]rios?|resolu[çc][ãa]o|justificativa|explica[çc][ãa]o|gabarito comentado)\s*[:\-–]?\s*(.*)$/i;
  const CUE = /^(?:\(?[a-z]\)\s*)?(leia|considere|observe|analise|veja|text[o]? para|read|look at)\s+(?:atentamente\s+)?(?:o|a|os|as|the|this)?\s*(?:seguinte\s+)?(texto|textos|trecho|fragmento|tirinha|charge|poema|quadrinho|cartum|reportagem|text|passage|article)|^(texto|text)\s+([ivx]+|\d+)\b|^(?:textos?|text)\s+(?:para|de apoio|base|associado|for)\b/i;
  const CUENEW = /^(?:(texto|text)\s+([ivx]+|\d+)\b|(leia|read)\s+(?:atentamente\s+)?(?:o|the)\s+(?:seguinte\s+)?(texto|text)\b)/i;
  const REFTXT = /\b(texto|trecho|fragmento|fragment|excerpt|sentence|ora[çc][ãa]o|per[íi]odo|express[ãa]o|par[áa]grafo|linhas?\s+\d|verso|estrofe|autora?\b|narrador|tirinha|charge|text|passage|paragraph|author|writer)\b/i;
  const NOISE = /^(anota[çc][õo]es|sum[áa]rio|apresenta[çc][ãa]o)$/i;

  function metaFromParens(raw) {
    const o = { raw: String(raw || '').trim() };
    if (!o.raw) return o;
    // "CESPE/CEBRASPE", "FUNDATEC/RS": sigla/sigla é um nome só
    const toks = o.raw.replace(/\b([A-ZÀ-Ý]{2,})\/([A-ZÀ-Ý]{2,})\b/g, '$1\u2215$2').split(/\s*(?:[–—|;,/]|\s-\s)\s*/).map((t) => t.trim().replace(/\u2215/g, '/')).filter(Boolean);
    const rest = [];
    toks.forEach((t) => { const y = t.match(/^(?:ano\s*:?\s*)?((?:19|20)\d{2})$/i); if (y && !o.ano) o.ano = +y[1]; else rest.push(t); });
    if (!o.ano) { const y = o.raw.match(/\b((?:19|20)\d{2})\b/); if (y) o.ano = +y[1]; }
    const r2 = rest.filter((t) => !/^\d+$/.test(t) && !(o.ano && t.includes(String(o.ano))));
    if (r2[0]) o.banca = r2[0];
    if (r2[1]) o.orgao = r2[1];
    if (r2.length > 2) o.cargo = r2.slice(2).join(' – ');
    return o;
  }
  function metaLabeled(line) {
    const o = {}; const re = /(ano|banca|[óo]rg[ãa]o|prova|cargo|disciplina|assunto|n[íi]vel)\s*:\s*(.*?)(?=\s+(?:ano|banca|[óo]rg[ãa]o|prova|cargo|disciplina|assunto|n[íi]vel)\s*:|$)/gi;
    let m, n = 0;
    while ((m = re.exec(line))) { n++; const k = norm(m[1]), v = m[2].trim(); if (k === 'ano') o.ano = +((v.match(/(?:19|20)\d{2}/) || [])[0] || 0) || undefined; else if (k === 'banca') o.banca = v; else if (k === 'orgao') o.orgao = v; else if (k === 'cargo' || k === 'prova') o[k === 'prova' ? 'prova' : 'cargo'] = v; else if (k === 'disciplina') o.disciplina = v; else if (k === 'assunto') o.assunto = v; }
    return n >= 2 ? o : null;
  }
  /** Junta linhas num texto: hifenização, parágrafos e itens. */
  function joinLines(ls) {
    let s = '', prev = null;
    ls.forEach((l) => {
      if (l.img) return;
      let t = l.text; if (!t) return;
      if (!prev) { s = t; prev = l; return; }
      const sz = l.size || 9, sameCol = prev.page === l.page && prev.col === l.col;
      const para = (sameCol && l.gap > sz * 1.75) || Math.abs((prev.size || 9) - sz) > 0.6 || /^(?:[IVX]{1,5}\s*[-–.)]|\(\s*\)|[•▪✓➢\-–]\s|y\s(?=\S)|\d+[.)]\s|[a-e]\)\s)/.test(t) || (sameCol && /[.:?!”"]$/.test(prev.text) && prev.xr < prev.colRight - sz * 3.5) || (sameCol && l.x > prev.x + sz * 0.9 && /[.:?!”"]$/.test(prev.text));
      if (prev.soft) { s = s.replace(/[-‐­]\s*$/, ''); s += t; }
      else if (/[a-zà-ú]-$/.test(s) && /^[a-zà-ú]/.test(t) && sameCol && prev.xr > prev.colRight - sz * 2) s = s.slice(0, -1) + t;
      else s += (para ? '\n' : ' ') + t;
      prev = l;
    });
    return s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  const sigla = (d) => { const w = norm(d).split(' ').filter((x) => x && !MIN.has(x)); return (w.length > 1 ? w.map((x) => x[0]).join('') : (w[0] || 'q').slice(0, 3)).toUpperCase(); };

  /**
   * @param {ReturnType<pageLines>[]} pages
   * @param {{prefixo?, banca?, orgao?, cargo?, area?, concurso?, fonte?}} o
   */
  function parse(pages, o = {}) {
    o = o || {};
    const avisos = [];
    // cabeçalhos/rodapés repetidos (texto igual na mesma altura em várias páginas)
    const freq = {};
    pages.forEach((p) => { const seen = new Set(); p.lines.forEach((l) => { if (l.img || !(l.y > p.height - 70 || l.y < 60)) return; const k = norm(l.text) + '@' + Math.round(l.y / 4); if (!seen.has(k)) { seen.add(k); freq[k] = (freq[k] || 0) + 1; } }); });
    const lim = Math.max(3, pages.length * 0.2);
    // sumário → disciplina por página impressa
    const sum = [];
    pages.slice(0, 12).forEach((p) => p.lines.forEach((l) => { const m = !l.img && l.text.replace(/\s*\|\s*/g, ' ').match(/^(.{3,90}?)\s*[.·…]{4,}\s*(\d{1,4})$/); if (m && /[A-Za-zÀ-ú]{3}/.test(m[1])) sum.push({ nome: m[1].trim(), pg: +m[2] }); }));
    sum.sort((a, b) => a.pg - b.pg);
    // número impresso da página: a diferença (impresso − índice) que mais se repete entre os números nas margens
    const offs = {}; pages.forEach((p) => { (p.nums || []).forEach((v) => { const d = v - p.n; offs[d] = (offs[d] || 0) + 1; }); });
    const best = Object.entries(offs).sort((a, b) => b[1] - a[1])[0];
    const off = best && best[1] >= Math.max(3, pages.length * 0.3) ? +best[0] : null;
    pages.forEach((p) => { p.pageNo = off === null ? null : p.n + off; });
    let lastHeader = null;
    const discOf = (p) => {
      if (p.header.length) { const h = p.header.filter((x) => x.length > 3 && isUpper(x)).sort((a, b) => b.length - a.length)[0]; if (h) lastHeader = h; }
      if (sum.length && p.pageNo != null) { const pg = p.pageNo; let d = null; sum.forEach((s) => { if (s.pg <= pg) d = s.nome; }); if (d) return d; }
      return lastHeader;
    };
    const nomes = new Set(sum.map((x) => norm(x.nome)));
    pages.forEach((p) => p.header.forEach((h) => { if (h.length > 3) nomes.add(norm(h)); }));
    const L = [];
    pages.forEach((p) => { const disc = discOf(p); p.lines.forEach((l) => { if (!l.img && p.pageNo != null && l.text === String(p.pageNo) && (l.y < 45 || l.y > p.height - 40)) return; if (!l.img && freq[norm(l.text) + '@' + Math.round(l.y / 4)] >= lim && (l.y > p.height - 70 || l.y < 60)) return; l.disc = disc; L.push(l); }); });
    const strict = L.filter((l) => !l.img && /^\d{1,4}\s*[.)\-–]\s*\(/.test(l.text)).length >= 10;

    const qs = [], textos = [], gabs = [];
    let cur = null, state = 'pre', group = 0, assunto = null, assuntoDisc = null, pend = [], texto = null, head = null, gab = null, expl = null, lastNum = 0, firstSeen = false;
    const closeHead = () => { if (head) { assunto = head.join(' ').replace(/\s+/g, ' ').trim(); assuntoDisc = head.disc; head = null; } };
    const flushPend = (forQ) => {
      // subtítulo curto logo antes da questão ("Substantivo", "Medidas de dispersão…"): vira o assunto
      const tx0 = pend.filter((l) => !l.img && l.text);
      if (forQ && tx0.length && tx0.length <= 2 && !pend.some((l) => l.img) && tx0.every((l) => l.text.length < 90 && !/[.,;:?!]$/.test(l.text) && /^[A-ZÀ-Ú]/.test(l.text) && !/[{}[\]=<>|]|\(\d| , /.test(l.text) && l.text.split(' ').length <= 12) && tx0.map((l) => l.text).join(' ').length < 120) {
        const sub = tx0.map((l) => l.text).join(' ').trim();
        tx0.forEach((l) => { l.used = 1; });
        if (!NOISE.test(sub)) { assunto = assunto && assuntoDisc === tx0[0].disc ? assunto.replace(/\s›.*$/, '') + ' › ' + sub : sub; assuntoDisc = tx0[0].disc; }
        pend = []; return forQ;
      }
      const real = pend.filter((l) => l.img || (l.text && !NOISE.test(l.text) && !(isUpper(l.text) && l.text.length < 60)));
      if (real.length) {
        const txt = joinLines(real), imgs = real.filter((l) => l.img).map((l) => ({ page: l.page, col: l.col, bbox: l.bbox, cx0: l.colLeft, cx1: l.colRight }));
        if (txt.length > 60 || imgs.length) { real.forEach((l) => { l.used = 1; }); texto = { texto: txt, imgs, group, range: rangeOf(txt), pagina: real[0].page, usado: 0, assunto: assuntoDisc === real[0].disc ? assunto : null }; textos.push(texto); if (!CUE.test(txt) && !REFTXT.test(txt.slice(0, 300))) avisos.push({ pagina: real[0].page, msg: 'Texto fora de questão associado à questão seguinte: confira.', trecho: txt.slice(0, 120) }); }
        else if (txt.trim() && firstSeen) avisos.push({ pagina: real[0].page, msg: 'Trecho solto entre questões (não importado): "' + txt.slice(0, 100) + '"' });
      }
      pend = []; return forQ;
    };
    const rangeOf = (t) => { const m = norm(t.slice(0, 400)).match(/(?:quest(?:ao|oes)|itens?|items?)\s*(?:de\s*|from\s*)?(\d{1,4})\s*(?:a|ate|e|-|–)\s*(\d{1,4})/); return m ? [+m[1], +m[2]] : null; };
    const newQ = (num, meta, rest, l) => {
      closeHead(); flushPend(true);
      if (cur) qs.push(cur);
      cur = { num, group, disc: l.disc, assunto: assuntoDisc === l.disc ? assunto : null, meta: meta || {}, enun: [], alts: [], imgs: [], expl: [], gab: null, page: l.page, pages: new Set([l.page]), firstLine: l };
      l.used = 1;
      const lm0 = rest && metaLabeled(rest);
      if (lm0) Object.keys(lm0).forEach((k) => { if (lm0[k] && !cur.meta[k]) cur.meta[k] = lm0[k]; });
      else if (rest) cur.enun.push({ ...l, text: rest });
      state = 'enun'; lastNum = num; firstSeen = true;
    };
    const altStart = (m, l) => {
      const letter = m[1], rest = m[2] || '';
      cur.altCase = cur.altCase || (letter === letter.toUpperCase() ? 'U' : 'l');
      const pieces = [[letter.toUpperCase(), rest]];
      // várias alternativas na mesma linha: "a) 7 b) 10 c) 12"
      let nx = String.fromCharCode(letter.toUpperCase().charCodeAt(0) + 1);
      for (;;) {
        const lastP = pieces[pieces.length - 1], re = new RegExp('(?:^|\\s)\\(?(' + (cur.altCase === 'U' ? nx : nx.toLowerCase()) + ')\\s*[)\\]]\\s+'), mm = lastP[1].match(re);
        if (!mm || nx > 'E') break;
        pieces.push([nx, lastP[1].slice(mm.index + mm[0].length)]); lastP[1] = lastP[1].slice(0, mm.index);
        nx = String.fromCharCode(nx.charCodeAt(0) + 1);
      }
      l.used = 1; pieces.forEach(([L2, t], k) => cur.alts.push({ L: L2, lines: t.trim() ? [{ ...l, text: t.trim() }] : [], x: l.x, raw: k === 0 && pieces.length === 1 ? l : null }));
      state = 'alts';
    };
    const expectAlt = () => String.fromCharCode(65 + cur.alts.length);

    for (let i = 0; i < L.length; i++) {
      const l = L[i];
      if (firstSeen) l.seen = 1;
      if (l.img) {
        if (state === 'gab' || state === 'pre') continue;
        if (state === 'after') pend.push(l);
        else if (cur) { l.used = 1; cur.imgs.push({ page: l.page, col: l.col, bbox: l.bbox, cx0: l.colLeft, cx1: l.colRight }); cur.pages.add(l.page); }
        continue;
      }
      const t = l.text;
      if (t && (nomes.has(norm(t)) || (isUpper(t) && t.length >= 4 && (l.gap > (l.size || 9) * 2.5 || l.size >= 14) && [...nomes].some((n) => (' ' + n + ' ').includes(' ' + norm(t) + ' '))))) { l.used = 1; continue; } // título da disciplina / cabeçalho
      // ---- gabarito
      const gh = t.match(GABH);
      if (gh && t.length < 60 && (!gh[2].trim() || /\d/.test(gh[2])) && (!cur || state !== 'enun' || cur.enun.length > 0)) {
        closeHead(); if (cur) { qs.push(cur); cur = null; } flushPend(); l.used = 1;
        gab = { group, pares: [], pagina: l.page, disc: l.disc }; gabs.push(gab); state = 'gab';
        if (gh[2]) { let m; GABPAIR.lastIndex = 0; while ((m = GABPAIR.exec(gh[2]))) gab.pares.push([+m[1], m[2].toUpperCase()]); }
        continue;
      }
      if (state === 'gab') {
        const pairs = []; let m; GABPAIR.lastIndex = 0; let cov = 0;
        while ((m = GABPAIR.exec(t))) { pairs.push([+m[1], m[2].toUpperCase()]); cov += m[0].length; }
        if (pairs.length && cov >= t.replace(/[\s|]/g, '').length * 0.6) { l.used = 1; gab.pares.push(...pairs); continue; }
        if (/^(quest[ãa]o|n[ºo°]|resposta|gab|alternativa)s?\b/i.test(t) && t.length < 40) { l.used = 1; continue; }
        if (!t.trim() || NOISE.test(t) || (isUpper(t) && t.length < 60 && !QSTART.test(t) && !HEAD.test(t))) { l.used = 1; continue; }
        group++; state = 'after'; texto = null; assunto = null;
      }
      // ---- início de questão
      let m = t.match(QSTART), wq = !m && t.match(QWORD);
      if (m || wq) {
        const num = +(m ? m[1] : wq[1]);
        const parens = m ? m[2] : null, rest = m ? (m[3] || '') : wq[2];
